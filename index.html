const money=function(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'};
const nav=[['cases','Кейсы','CASE'],['events','Ивенты','EVENT'],['shop','Магазин','SHOP'],['upgrade','Апгрейд','UP'],['inventory','Инвентарь','INV'],['account','Профиль','PROFILE']];

function setupNav(active){document.getElementById('mainNav').innerHTML=nav.map(function(n){return '<button class="nav-btn '+(active===n[0]?'active':'')+'" onclick="go(\''+n[0]+'\')">'+n[2]+' '+n[1]+'</button>'}).join('');document.getElementById('mobileNav').innerHTML=nav.map(function(n){return '<button class="'+(active===n[0]?'active':'')+'" onclick="go(\''+n[0]+'\')">'+n[2]+'<br>'+n[1]+'</button>'}).join('')}
function go(page){setupNav(page);const m=document.getElementById('appMain');if(page==='cases')renderCases(m);else if(page==='events')renderEvents(m);else if(page==='shop')renderShop(m);else if(page==='upgrade')renderUpgrade(m);else if(page==='inventory')renderInventory(m);else renderAccount(m);updateBalanceUI();window.scrollTo({top:0,behavior:'smooth'})}
function updateBalanceUI(){document.getElementById('balance').textContent=money(state.balance);document.getElementById('loginPill').textContent=currentUser?currentUser.username:'Войти'}
function renderCases(m){m.innerHTML='<div class="notice"><div>Крутые скины CS2 · Апгрейд · Кейсы</div></div><div class="promo"><h1>Бонус на счёт</h1><p>Промокод STORM-12</p><div class="bonus">+14%</div></div><div class="toolbar"><input id="caseSearch" class="search" placeholder="Поиск..." oninput="filterCases(this.value)"></div><div id="caseArea">'+groupMarkup()+'</div>'}
function renderEvents(m){m.innerHTML='<div class="section-title"><h2>Ивенты</h2></div><div class="event-list">'+events.map(function(e){return '<article class="event-card"><span class="event-tag">'+e.tag+'</span><div class="event-art">'+artImg(e.caseName,'case')+'</div><div class="event-title">'+e.title+'</div><div class="event-desc">'+e.desc+'</div><button class="event-btn" onclick=\'openCaseByName('+JSON.stringify(e.caseName)+')\'>Открыть</button></article>'}).join('')+'</div>'}
function groupMarkup(){let out='';for(const title in groups){const list=groups[title];out+='<section class="case-section"><div class="case-head"><span class="dot"></span><b>'+title+'</b><small>'+list.length+' кейсов</small></div><div class="grid">'+list.map(function(c){return caseCard(c)}).join('')+'</div></section>'}return out}
function caseCard(c){return '<div class="card case-card" data-name="'+c[0].toLowerCase()+'"><div class="case-art">'+artImg(c[0],'case')+'</div><div class="case-name">'+c[0]+'</div><div class="case-meta"><span>'+c[1]+' предм.</span><span class="case-price">'+money(c[2])+'</span></div><button class="open-btn" onclick=\'openCaseByName('+JSON.stringify(c[0])+')\'>Открыть</button></div>'}
function filterCases(q){document.querySelectorAll('#caseArea .card').forEach(function(el){el.style.display=el.dataset.name.includes(q.toLowerCase())?'':'none'})}
function renderShop(m){m.innerHTML='<div class="section-title"><h2>Магазин</h2><span>'+skins.length+' предметов</span></div><div class="grid">'+skins.map(function(x,i){return skinCard(x,i)}).join('')+'</div>'}
function skinCard(x,i){return '<div class="card case-card"><div class="case-art">'+artImg(x[0])+'</div><div class="case-name">'+x[0]+'</div><div class="case-price">'+money(x[2])+'</div><button class="open-btn" onclick="buySkin('+i+')">Купить</button></div>'}
function renderInventory(m){m.innerHTML='<div class="section-title"><h2>Инвентарь</h2><span>'+state.inventory.length+' предметов</span></div>'+(state.inventory.length?'<div class="grid">'+state.inventory.map(function(x){return '<div class="card case-card"><div class="case-art">'+artImg(x[0])+'</div><div class="case-name">'+x[0]+'</div><div class="case-price">'+money(x[2])+'</div></div>'}).join('')+'</div>':'<div class="panel"><div class="muted">Пусто.</div></div>')}
function renderUpgrade(m){m.innerHTML='<div class="section-title"><h2>Апгрейд</h2></div><div class="panel"><div class="upgrade-grid"><div class="select-card"><h3>ТВОЙ ПРЕДМЕТ</h3><select id="upFrom" onchange="updateChance()"><option value="">Выбери</option>'+state.inventory.map(function(x,i){return '<option value="'+i+'">'+x[0]+' — '+money(x[2])+'</option>'}).join('')+'</select></div><div class="upgrade-arrow">→</div><div class="select-card"><h3>ЦЕЛЬ</h3><select id="upTo" onchange="updateChance()"><option value="">Выбери</option>'+skins.map(function(x,i){return '<option value="'+i+'">'+x[0]+' — '+money(x[2])+'</option>'}).join('')+'</select></div></div><div class="chance">Шанс: <b id="chance">0%</b><div class="meter"><span id="chanceBar"></span></div></div><button class="open-btn" style="max-width:320px;margin-top:14px" onclick="doUpgrade()">Апгрейд</button></div>'}
function renderAccount(m){m.innerHTML='<div class="two-col"><div class="panel"><div class="profile-row"><div class="avatar">'+(currentUser?currentUser.username.slice(0,2).toUpperCase():'?')+'</div><div><h2 style="margin:0">'+(currentUser?currentUser.username:'Гость')+'</h2></div></div><div class="stat-grid" style="margin-top:16px"><div class="stat"><span>Баланс</span><b>'+money(state.balance)+'</b></div><div class="stat"><span>Кейсов</span><b>'+state.cases+'</b></div><div class="stat"><span>Апгрейдов</span><b>'+state.upgrades+'</b></div><div class="stat"><span>Макс</span><b>'+money(state.max)+'</b></div></div></div><div class="panel"><h3 style="margin-top:0">Аккаунт</h3>'+(currentUser?'<button class="secondary" style="padding:10px 12px;border-radius:8px" onclick="logout()">Выйти</button>':'<p class="muted">Войдите, чтобы играть.</p>')+'</div></div>'}
function openCaseByName(name){if(!currentUser)return showInfo('Вход','Сначала войдите в аккаунт.');let c=null;for(let i=0;i<names.length;i++){if(names[i][0]===name){c=names[i];break}}if(!c)return;if(state.balance<c[2])return showInfo('Мало средств','Пополните баланс.');let winner=skins[Math.floor(Math.random()*skins.length)];state.balance-=c[2];state.cases++;state.max=Math.max(state.max,winner[2]);saveState();let reel=[];for(let i=0;i<40;i++)reel.push(skins[Math.floor(Math.random()*skins.length)]);reel[30]=winner;let rh='';for(let j=0;j<reel.length;j++){rh+='<div class="item '+(j===30?'winner':'')+'"><span class="item-icon">'+artImg(reel[j][0])+'</span><span>'+reel[j][0]+'</span><b>'+money(reel[j][2])+'</b></div>'}document.getElementById('genericDialog').innerHTML='<div class="dialog-head"><div><b>'+c[0]+'</b></div><button class="close" onclick="closeModal(\'genericModal\')">×</button></div><div class="dialog-body"><div class="reel-wrap"><div class="reel" id="reel">'+rh+'</div></div><div class="reel-note" id="reelResult">Прокрутка...</div><button id="takeWin" class="open-btn" disabled>...</button></div>';openModal('genericModal');const reelEl=document.getElementById('reel');const target=30*134-(reelEl.parentElement.clientWidth/2-63);requestAnimationFrame(function(){requestAnimationFrame(function(){reelEl.style.transition='transform 6.2s cubic-bezier(.08,.72,.08,1)';reelEl.style.transform='translateX(-'+Math.max(0,target)+'px)'})});setTimeout(function(){const res=document.getElementById('reelResult'),btn=document.getElementById('takeWin');if(res)res.innerHTML='<b style="color:#ffc26e">ВЫПАЛО: '+winner[0]+' — '+money(winner[2])+'</b>';if(btn){btn.disabled=false;btn.textContent='Забрать';btn.onclick=function(){state.inventory.push([winner[0],winner[1],winner[2]]);saveState();closeModal('genericModal');go('inventory')}}},6500)}
function buySkin(i){if(!currentUser)return showInfo('Вход','Сначала войдите.');let x=skins[i];if(state.balance<x[2])return showInfo('Мало средств','Пополните.');state.balance-=x[2];state.inventory.push([x[0],x[1],x[2]]);saveState();go('inventory')}
function updateChance(){const a=document.getElementById('upFrom'),b=document.getElementById('upTo');if(!a||!b)return;const ce=document.getElementById('chance'),bar=document.getElementById('chanceBar');if(a.value===''||b.value===''){ce.textContent='0%';bar.style.width='0%';return}const from=state.inventory[Number(a.value)],to=skins[Number(b.value)];const c=calcChance(from[2],to[2]);ce.textContent=c.toFixed(2)+'%';bar.style.width=c+'%'}
function calcChance(from,to){if(!from||!to)return 0;if(to<=from)return 80;return Math.max(1,Math.min(80,(from/to)*80))}
function doUpgrade(){const a=document.getElementById('upFrom'),b=document.getElementById('upTo');if(!a||!b||a.value===''||b.value==='')return showInfo('Апгрейд','Выбери предмет и цель.');const i=Number(a.value),from=state.inventory[i],target=skins[Number(b.value)],chance=calcChance(from[2],target[2]);const success=Math.random()*100<chance;if(success){state.inventory[i]=[target[0],target[1],target[2]];state.max=Math.max(state.max,target[2]);showInfo('Успех','Вы выиграли '+target[0])}else{state.inventory.splice(i,1);showInfo('Неудача','Предмет сгорел')}state.upgrades++;saveState();go('upgrade')}
function topup(){if(!currentUser)return showInfo('Вход','Сначала войдите.');document.getElementById('genericDialog').innerHTML='<div class="dialog-head"><b>Пополнение баланса</b><button class="close" onclick="closeModal(\'genericModal\')">×</button></div><div class="dialog-body"><div class="deposit-card"><div style="font-weight:800">Выберите сумму</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+[100,300,500,1000,3000,5000].map(function(v){return '<button class="open-btn" style="flex:1;min-width:90px" onclick="startSbpPayment('+v+')">'+v+' ₽</button>'}).join('')+'</div><p class="muted" style="margin-top:12px;font-size:12px">После перевода нажмите «Я оплатил».</p></div></div>';openModal('genericModal')}
function startSbpPayment(amount){if(!amount||amount<100)return showInfo('Оплата','Минимум 100 ₽.');window.open('https://www.sberbank.com/sms/pbpn?requisiteNumber=79106919694','_blank');setTimeout(function(){document.getElementById('genericDialog').innerHTML='<div class="dialog-head"><b>Подтверждение</b><button class="close" onclick="closeModal(\'genericModal\')">×</button></div><div class="dialog-body"><div class="deposit-card"><div style="font-weight:800">Перевели '+amount+' ₽?</div><button class="open-btn" style="width:100%;margin-top:12px" onclick="confirmDeposit('+amount+')">✅ Я оплатил</button><button class="secondary" style="width:100%;margin-top:8px;padding:10px;border-radius:8px" onclick="closeModal(\'genericModal\')">Отмена</button></div></div>'},500)}
async function confirmDeposit(amount){try{const r=await fetch(API+'/api/deposit-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:currentUser.username,amount:amount})});const d=await r.json();if(d.ok){closeModal('genericModal');showInfo('Заявка отправлена','Ожидайте подтверждения.')}else{showInfo('Ошибка','Не удалось.')}}catch(e){showInfo('Ошибка','Сервер недоступен.')}}
function authOpen(){if(currentUser)return logout();openModal('authModal')}
async function doLogin(){const u=document.getElementById('authLogin').value.trim(),p=document.getElementById('authPass').value,msg=document.getElementById('authMsg');try{const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const d=await r.json();if(d.ok){authToken=d.token;currentUser=d.user;localStorage.setItem('l1nxs_token',authToken);applyUser(d.user);closeModal('authModal');go('cases')}else{msg.textContent=d.error||'Ошибка'}}catch(e){msg.textContent='Сервер недоступен'}}
async function doRegister(){const u=document.getElementById('authLogin').value.trim(),p=document.getElementById('authPass').value,msg=document.getElementById('authMsg');try{const r=await fetch(API+'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const d=await r.json();if(d.ok){authToken=d.token;currentUser=d.user;localStorage.setItem('l1nxs_token',authToken);applyUser(d.user);closeModal('authModal');go('cases')}else{msg.textContent=d.error||'Ошибка'}}catch(e){msg.textContent='Сервер недоступен'}}
function applyUser(u){state.balance=u.balance||0;state.inventory=u.inventory||[];state.cases=u.cases||0;state.upgrades=u.upgrades||0;state.max=u.max||0;updateBalanceUI()}
async function loadMe(){if(!authToken)return;try{const r=await fetch(API+'/api/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:authToken})});const d=await r.json();if(d.ok){currentUser=d.user;applyUser(d.user)}}catch(e){}}
async function saveState(){if(!authToken)return;try{await fetch(API+'/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:authToken,balance:state.balance,inventory:state.inventory,cases:state.cases,upgrades:state.upgrades,max:state.max})})}catch(e){}updateBalanceUI()}
function logout(){localStorage.removeItem('l1nxs_token');authToken=null;currentUser=null;state={balance:0,inventory:[],cases:0,upgrades:0,max:0};updateBalanceUI();go('cases')}
function adminOpen(){document.getElementById('genericDialog').innerHTML='<div class="dialog-head"><b>ВХОД В АДМИНКУ</b><button class="close" onclick="closeModal(\'genericModal\')">×</button></div><div class="dialog-body"><p class="muted">Нажмите кнопку — бот пришлёт вам код в Telegram.</p><button class="open-btn" onclick="adminLoginStart()">Запросить вход</button><div id="adminMsg" class="muted" style="margin-top:8px"></div></div>';openModal('genericModal')}
async function adminLoginStart(){const msg=document.getElementById('adminMsg');msg.textContent='Запрос отправлен. Проверьте Telegram...';try{const r=await fetch(API+'/api/admin-login-start',{method:'POST'});const d=await r.json();if(!d.ok)return msg.textContent='Ошибка';const code=d.code;let tries=0;const check=setInterval(async function(){tries++;if(tries>60){clearInterval(check);msg.textContent='Истекло время.';return}const r2=await fetch(API+'/api/admin-login-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})});const d2=await r2.json();if(d2.ok){clearInterval(check);adminToken=d2.adminToken;localStorage.setItem('l1nxs_admin_token',adminToken);closeModal('genericModal');openModal('adminModal');renderAdmin()}},2000)}catch(e){msg.textContent='Сервер недоступен'}}
async function renderAdmin(){if(!adminToken)return adminOpen();try{const r=await fetch(API+'/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminToken:adminToken})});const d=await r.json();if(!d.ok)return adminOpen();document.getElementById('adminDialog').innerHTML='<div class="admin-panel"><h3>Игроки: '+d.users.length+'</h3><table class="admin-table"><thead><tr><th>Логин</th><th>Баланс</th><th>Кейсы</th><th>Апгр.</th><th></th></tr></thead><tbody>'+d.users.map(function(u){return '<tr><td><b>'+u.username+'</b></td><td>'+money(u.balance)+'</td><td>'+u.cases+'</td><td>'+u.upgrades+'</td><td><div class="admin-actions"><button class="admin-plus" onclick="adminAdd(\''+u.username+'\',500)">+500</button><button class="admin-minus" onclick="adminAdd(\''+u.username+'\',-500)">-500</button></div></td></tr>'}).join('')+'</tbody></table></div>'}catch(e){showInfo('Ошибка','Не удалось загрузить')}}
async function adminAdd(username,amount){try{await fetch(API+'/api/admin/balance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminToken:adminToken,username:username,amount:amount})});renderAdmin()}catch(e){}}
function showInfo(title,text){document.getElementById('genericDialog').innerHTML='<div class="dialog-head"><b>'+title+'</b><button class="close" onclick="closeModal(\'genericModal\')">×</button></div><div class="dialog-body"><p class="muted">'+text+'</p><button class="open-btn" onclick="closeModal(\'genericModal\')">Закрыть</button></div>';openModal('genericModal')}
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('.modal').forEach(function(x){x.addEventListener('click',function(e){if(e.target===x)closeModal(x.id)})});
loadMe();
go('cases');
</script>
</body></html>
