<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L1nxsBattle</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e1116;color:#fff;font:14px/1.4 Arial,sans-serif;min-height:100vh}
button{cursor:pointer;border:0;color:#fff;font-family:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.header{background:#0e1116;border-bottom:1px solid #1c2028;padding:12px 16px;position:sticky;top:0;z-index:100}
.header-row{max-width:1400px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo-block{display:flex;flex-direction:column;cursor:pointer}
.logo-top{font-size:20px;font-weight:900;letter-spacing:1px;line-height:1}
.logo-top .g{color:#ff6a00}
.logo-sub{font-size:9px;color:#8a94a3;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.header-right{display:flex;align-items:center;gap:10px}
.online{display:flex;align-items:center;gap:4px;color:#4ade80;font-weight:700;font-size:13px}
.online svg{width:16px;height:16px}
.balance{padding:6px 10px;background:#181c23;border-radius:6px;font-size:12px;font-weight:600}
.balance b{color:#ff9a00}
.menu-btn{background:transparent;padding:4px;display:grid;place-items:center}
.menu-btn svg{width:24px;height:24px;stroke:#ff6a00;stroke-width:2.5;fill:none}
.container{max-width:1400px;margin:auto;padding:16px;flex:1;width:100%}
.section-title{margin:16px 0 12px;font-size:15px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.cases-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.case-card{background:#141820;border-radius:10px;padding:10px;display:flex;flex-direction:column;transition:.2s}
.case-card:hover{background:#1a1f29}
.case-img-box{width:100%;aspect-ratio:1.1;display:grid;place-items:center;padding:6px;background:#0e1116;border-radius:8px;overflow:hidden}
.case-img-box img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
.case-name-top{font-weight:900;font-size:13px;color:#fff;text-transform:uppercase;margin-top:8px;line-height:1.2;text-align:center;min-height:32px}
.case-items-row{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:4px}
.case-items-count{font-size:11px;color:#7d8794}
.badge-new{background:#dc2626;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px;letter-spacing:.5px}
.case-price-box{margin:10px auto;border:1.5px solid #ff6a00;border-radius:4px;padding:5px 20px;font-size:13px;font-weight:800;color:#ff6a00;background:#0e1116;text-align:center;min-width:90px;width:fit-content}
.case-open-btn{background:linear-gradient(135deg,#ff8c00,#e65c00);padding:9px;border-radius:6px;font-weight:800;font-size:12px;letter-spacing:.5px;text-transform:uppercase;width:100%}
.skins-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.skin-card{background:#141820;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:.2s;cursor:pointer}
.skin-card:hover{background:#1a1f29}
.skin-img-box{width:100%;aspect-ratio:1.4;display:grid;place-items:center;padding:14px;position:relative;background:radial-gradient(circle at 50% 40%,#1a1f29,#0e1116)}
.skin-img-box img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.skin-price-tag{position:absolute;top:8px;left:8px;background:#1c2028;border:1px solid #ff6a00;color:#ff9a00;font-size:11px;font-weight:800;padding:3px 8px;border-radius:4px}
.skin-info{padding:8px 10px 10px}
.skin-name{font-size:12px;font-weight:700;color:#fff;line-height:1.3}
.skin-name .st{color:#cf5cff}
.skin-bottom-line{height:3px;width:100%}
.footer{margin-top:40px;padding:20px;border-top:1px solid #1c2028;color:#5d6672;font-size:11px;text-align:center}
.panel{background:#141820;border-radius:10px;padding:18px;margin-top:16px}
.muted{color:#7d8794;font-size:12px}
.add-btn{background:linear-gradient(135deg,#ff8c00,#e65c00);padding:9px 16px;border-radius:6px;font-weight:700;font-size:13px}
.login-pill{background:#1c2028;padding:9px 16px;border-radius:6px;font-weight:600;font-size:13px}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#141820;border-top:1px solid #1c2028;padding:6px;z-index:100}
.mobile-nav-inner{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mobile-nav button{background:transparent;color:#7d8794;padding:6px 4px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:.5px}
.mobile-nav button.active{background:#1c2028;color:#ff9a00}
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.dialog{width:min(500px,100%);background:#141820;border-radius:12px;padding:20px;max-height:90vh;overflow:auto;border:1px solid #1c2028}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dialog-head h3{font-size:16px;text-transform:uppercase;letter-spacing:.5px}
.close{width:30px;height:30px;border-radius:6px;background:#1c2028;color:#8a94a3;font-size:16px}
.input{width:100%;background:#0e1116;border:1px solid #2a3038;padding:11px;border-radius:6px;color:#fff;margin-bottom:10px}
.case-opening-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.case-opening-overlay.show{display:flex}
.reel-container{width:100%;overflow:hidden;position:relative;padding:30px 0}
.reel-container::before,.reel-container::after{content:'';position:absolute;top:0;bottom:0;width:80px;z-index:10;pointer-events:none}
.reel-container::before{left:0;background:linear-gradient(90deg,#0e1116,transparent)}
.reel-container::after{right:0;background:linear-gradient(-90deg,#0e1116,transparent)}
.reel{display:flex;gap:12px;padding:0 20px;will-change:transform}
.reel-item{flex:0 0 140px;height:120px;background:#1a1f29;border:2px solid #2a3038;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.reel-item img{width:70px;height:50px;object-fit:contain}
.reel-item .rname{font-size:9px;font-weight:600;text-align:center;line-height:1.2;color:#b0b8c4}
.reel-item.winner{border-color:#ff6a00;box-shadow:0 0 25px rgba(255,106,0,.5)}
.result-box{text-align:center;padding:0 20px}
.result-box h2{font-size:22px;margin-bottom:8px;color:#fff}
.result-box .item-name{color:#ff9a00;font-size:18px;font-weight:800}
.result-box .item-price{color:#7d8794;margin-top:4px}
.hidden{display:none!important}
@media(min-width:768px){
  .cases-grid{grid-template-columns:repeat(4,1fr)}
  .skins-grid{grid-template-columns:repeat(3,1fr)}
  .mobile-nav{display:none}
}
@media(max-width:767px){
  .mobile-nav{display:block}
  .container{padding-bottom:70px}
  .logo-top{font-size:16px}
  .online{font-size:11px}
}
</style>
</head>

<script>
var SKIN_IMAGES = {};
fetch('https://bymykel.github.io/CSGO-API/api/en/skins.json')
  .then(function(r){ return r.json(); })
  .then(function(data){
    data.forEach(function(s){
      if(s && s.name && s.image){
        SKIN_IMAGES[s.name.toLowerCase().trim()] = s.image;
        var noStar = s.name.replace(/^★\s*/,'').toLowerCase().trim();
        if(!SKIN_IMAGES[noStar]) SKIN_IMAGES[noStar] = s.image;
      }
    });
    console.log('[skins]', Object.keys(SKIN_IMAGES).length);
  }).catch(function(e){ console.warn(e); });

var CASE_IMAGES = {};
fetch('https://bymykel.github.io/CSGO-API/api/en/crates.json')
  .then(function(r){ return r.json(); })
  .then(function(data){
    data.forEach(function(c){
      if(c && c.name && c.image){
        CASE_IMAGES[c.name.toLowerCase().trim()] = c.image;
      }
    });
    console.log('[cases]', Object.keys(CASE_IMAGES).length);
    if(typeof currentPage !== 'undefined' && currentPage === 'cases') go('cases');
  }).catch(function(e){ console.warn(e); });

const money = function(n){ return Math.round(n).toLocaleString('ru-RU') + ' ₽'; };

function artImg(name){
  var raw = String(name).toLowerCase().trim();
  var noStar = raw.replace(/^★\s*/,'').trim();
  var url = SKIN_IMAGES[raw] || SKIN_IMAGES[noStar];
  if(url) return '<img src="' + url + '" alt="" loading="lazy">';
  return '<div style="font-size:36px;opacity:.3">🎁</div>';
}

function svgCase(name){
  var hue = (Array.from(name).reduce(function(a,c){return a+c.charCodeAt(0)},0)*17)%360;
  var h2 = (hue + 35) % 360;
  var label = name.toUpperCase().slice(0, 12);
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" style="width:100%;height:100%">' +
    '<defs>' +
    '<linearGradient id="cg' + hue + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="hsl(' + hue + ' 65% 55%)"/>' +
    '<stop offset="1" stop-color="hsl(' + hue + ' 55% 28%)"/>' +
    '</linearGradient>' +
    '<linearGradient id="cl' + hue + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="hsl(' + h2 + ' 70% 65%)"/>' +
    '<stop offset="1" stop-color="hsl(' + hue + ' 60% 38%)"/>' +
    '</linearGradient>' +
    '</defs>' +
    '<ellipse cx="120" cy="168" rx="98" ry="9" fill="#000" opacity=".5"/>' +
    '<rect x="18" y="72" width="204" height="86" rx="7" fill="url(#cg' + hue + ')" stroke="hsl(' + hue + ' 70% 20%)" stroke-width="2.5"/>' +
    '<rect x="18" y="22" width="204" height="56" rx="7" fill="url(#cl' + hue + ')" stroke="hsl(' + hue + ' 70% 20%)" stroke-width="2.5"/>' +
    '<line x1="18" y1="38" x2="222" y2="38" stroke="#000" stroke-opacity=".2" stroke-width="1.5"/>' +
    '<line x1="18" y1="58" x2="222" y2="58" stroke="#000" stroke-opacity=".2" stroke-width="1.5"/>' +
    '<line x1="60" y1="72" x2="60" y2="158" stroke="#000" stroke-opacity=".25" stroke-width="3"/>' +
    '<line x1="180" y1="72" x2="180" y2="158" stroke="#000" stroke-opacity=".25" stroke-width="3"/>' +
    '<line x1="18" y1="95" x2="222" y2="95" stroke="#000" stroke-opacity=".18" stroke-width="1"/>' +
    '<line x1="18" y1="138" x2="222" y2="138" stroke="#000" stroke-opacity=".18" stroke-width="1"/>' +
    '<rect x="106" y="48" width="28" height="36" rx="4" fill="#1a1f29" stroke="#aaa" stroke-width="2"/>' +
    '<circle cx="120" cy="63" r="4.5" fill="#ff9a00"/>' +
    '<rect x="117" y="68" width="6" height="12" rx="2" fill="#ff9a00"/>' +
    '<rect x="102" y="12" width="36" height="11" rx="4" fill="#1a1f29" stroke="#666" stroke-width="1.5"/>' +
    '<text x="120" y="116" text-anchor="middle" fill="#fff" font-size="13" font-family="Arial" font-weight="900" letter-spacing="1">' + label + '</text>' +
    '<text x="120" y="148" text-anchor="middle" fill="#fff" font-size="7" font-family="Arial" letter-spacing="2.5" opacity=".55">L1NXSBATTLE</text>' +
    '</svg>';
  return svg;
}

function caseArt(name){
  var key = String(name).toLowerCase().trim();
  if(CASE_IMAGES[key]) return '<img src="' + CASE_IMAGES[key] + '" alt="">';
  return svgCase(name);
}

function hasStatTrak(name){ return /StatTrak/i.test(name); }
function cleanName(name){ return name.replace(/^StatTrak™\s*/i, ''); }
function rarityColor(name){
  if(/Knife|Karambit|Bayonet|Doppler|Fade|Lore|Marble|Tiger|Slaughter|Case Hardened/i.test(name)) return '#eb4b4b';
  if(/Gloves|Перчатки|Howl|Dragon Lore|Fire Serpent|Medusa|Wild Lotus/i.test(name)) return '#eb4b4b';
  if(/Asiimov|Printstream|Vulcan|Hyper Beast|Neon Rider|Bloodsport|Empress/i.test(name)) return '#d32ce6';
  if(/Redline|Kill Confirmed|Orion|Guardian|Cyrex/i.test(name)) return '#8847ff';
  return '#4b69ff';
}

  { name: 'CS20 Case', ru: 'CS20', price: 149, items: 17 },

  { name: 'Lonestar', ru: 'Lonestar', price: 34, items: 34, isNew: true },
  { name: 'Valkyra', ru: 'Valkyra', price: 99, items: 32, isNew: true },

  ['StatTrak™ MP5-SD | Гаусс', 59], ['StatTrak™ M4A4 | Рубитель', 8],
  ['MP5-SD | Кислотный душ', 96], ['Glock-18 | Расписная берёза', 14],

var currentUser = null;
var authToken = localStorage.getItem('l1nxs_token') || null;
var adminToken = localStorage.getItem('l1nxs_admin_token') || null;
var state = { balance: 0, inventory: [], cases: 0, upgrades: 0, max: 0, maxBalance: 0, deposited: 0 };
var API = 'https://l1nxs-bot.longyxs999.workers.dev';
var currentPage = 'cases';
var leaderTab = 'balance';

var nav = [['cases','КЕЙСЫ'],['shop','СКИНЫ'],['inventory','ИНВЕНТАРЬ'],['leaderboard','ЛИДЕРЫ'],['account','ПРОФИЛЬ']];

function setupNav(active){
  document.getElementById('mobileNav').innerHTML = nav.map(function(n){
    return '<button class="' + (active === n[0] ? 'active' : '') + '" onclick="go(\'' + n[0] + '\')">' + n[1] + '</button>';
  }).join('');
}

function go(page){
  currentPage = page;
  setupNav(page);
  var m = document.getElementById('appMain');
  if(page === 'cases') renderCases(m);
  else if(page === 'shop') renderShop(m);
  else if(page === 'inventory') renderInventory(m);
  else if(page === 'leaderboard') renderLeaderboard(m);
  else renderAccount(m);
  updateBalanceUI();
  window.scrollTo({top:0, behavior:'smooth'});
}

function updateBalanceUI(){
  document.getElementById('balance').textContent = money(state.balance);
  document.getElementById('loginPill').textContent = currentUser ? currentUser.username : 'Войти';
}

function renderCases(m){
  m.innerHTML = '<div class="section-title">Кейсы</div><div class="cases-grid">' +
    CASES.map(function(c){
      var display = c.ru || c.name;
      var badge = c.isNew ? '<span class="badge-new">NEW</span>' : '';
      return '<div class="case-card">' +
        '<div class="case-img-box">' + caseArt(c.name) + '</div>' +
        '<div class="case-name-top">' + display + '</div>' +
        '<div class="case-items-row"><span class="case-items-count">' + c.items + ' предметов</span>' + badge + '</div>' +
        '<div class="case-price-box">' + money(c.price) + '</div>' +
        '<button class="case-open-btn" onclick="openCase(\'' + c.name.replace(/'/g,"\\'") + '\')">Открыть</button>' +
        '</div>';
    }).join('') + '</div>';
}

function renderShop(m){
  m.innerHTML = '<div class="section-title">Магазин скинов</div><div class="skins-grid">' +
    skinsList.map(function(x, i){
      var color = rarityColor(x[0]);
      var isST = hasStatTrak(x[0]);
      var clean = cleanName(x[0]);
      var nameHtml = isST ? '<span class="st">StatTrak™</span> ' + clean : clean;
      return '<div class="skin-card" onclick="buySkin(' + i + ')">' +
        '<div class="skin-img-box">' + artImg(x[0]) + '<div class="skin-price-tag">' + money(x[1]) + '</div></div>' +
        '<div class="skin-info"><div class="skin-name">' + nameHtml + '</div></div>' +
        '<div class="skin-bottom-line" style="background:' + color + '"></div>' +
        '</div>';
    }).join('') + '</div>';
}

function renderInventory(m){
  m.innerHTML = '<div class="section-title">Инвентарь (' + state.inventory.length + ')</div>' +
    (state.inventory.length ? '<div class="skins-grid">' + state.inventory.map(function(x){
      var color = rarityColor(x[0]);
      var isST = hasStatTrak(x[0]);
      var clean = cleanName(x[0]);
      var nameHtml = isST ? '<span class="st">StatTrak™</span> ' + clean : clean;
      return '<div class="skin-card"><div class="skin-img-box">' + artImg(x[0]) + '</div><div class="skin-info"><div class="skin-name">' + nameHtml + '</div></div><div class="skin-bottom-line" style="background:' + color + '"></div></div>';
    }).join('') + '</div>' : '<div class="panel"><div class="muted">Инвентарь пуст.</div></div>');
}

function renderLeaderboard(m){
  m.innerHTML = '<div class="section-title">Лидеры</div>' +
    '<div style="display:flex;gap:6px;margin-bottom:14px;overflow:auto">' +
    '<button class="' + (leaderTab==='balance'?'add-btn':'login-pill') + '" style="padding:8px 14px;font-size:12px;white-space:nowrap" onclick="switchLeader(\'balance\')">БАЛАНС</button>' +
    '<button class="' + (leaderTab==='upgrades'?'add-btn':'login-pill') + '" style="padding:8px 14px;font-size:12px;white-space:nowrap" onclick="switchLeader(\'upgrades\')">АПГРЕЙДЫ</button>' +
    '<button class="' + (leaderTab==='cases'?'add-btn':'login-pill') + '" style="padding:8px 14px;font-size:12px;white-space:nowrap" onclick="switchLeader(\'cases\')">КЕЙСЫ</button>' +
    '<button class="' + (leaderTab==='deposited'?'add-btn':'login-pill') + '" style="padding:8px 14px;font-size:12px;white-space:nowrap" onclick="switchLeader(\'deposited\')">ПОПОЛНЕНИЯ</button>' +
    '</div><div id="leaderContent" class="panel"><div class="muted">Загрузка...</div></div>';
  loadLeaderboard();
}

function switchLeader(tab){
  leaderTab = tab;
  renderLeaderboard(document.getElementById('appMain'));
}

async function loadLeaderboard(){
  var box = document.getElementById('leaderContent');
  if(!box) return;
  try{
    var r = await fetch(API + '/api/leaderboard', { method:'POST' });
    var d = await r.json();
    if(!d.ok){ box.innerHTML = '<div class="muted">Ошибка загрузки.</div>'; return; }
    var data = d[leaderTab] || [];
    if(!data.length){ box.innerHTML = '<div class="muted">Пока никого нет.</div>'; return; }
    var titles = { balance:'Макс. баланс', upgrades:'Апгрейдов', cases:'Кейсов', deposited:'Пополнено' };
    var isBalance = leaderTab === 'balance';
    box.innerHTML = '<table style="width:100%;border-collapse:collapse">' +
      '<thead><tr style="color:#7d8794;text-align:left;font-size:12px"><th style="padding:10px">#</th><th style="padding:10px">Игрок</th><th style="padding:10px;text-align:right">' + titles[leaderTab] + '</th></tr></thead><tbody>' +
      data.map(function(u, i){
        var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
        var value = isBalance ? money(u.maxBalance) : u[leaderTab];
        return '<tr style="border-bottom:1px solid #1c2028"><td style="padding:10px;font-weight:800;color:' + (i<3?'#ff9a00':'#7d8794') + '">' + medal + '</td>' +
          '<td style="padding:10px;font-weight:600">' + u.username + '</td>' +
          '<td style="padding:10px;text-align:right;color:#ff9a00;font-weight:800">' + value + '</td></tr>';
      }).join('') + '</tbody></table>';
  }catch(e){ box.innerHTML = '<div class="muted">Сервер недоступен.</div>'; }
}

function renderAccount(m){
  m.innerHTML = '<div class="section-title">Профиль</div><div class="panel"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">' +
    '<div style="width:52px;height:52px;border-radius:10px;background:#1c2028;display:grid;place-items:center;font-size:22px;font-weight:900;color:#ff9a00">' + (currentUser ? currentUser.username.slice(0,2).toUpperCase() : '?') + '</div>' +
    '<div><h2 style="margin:0;font-size:18px">' + (currentUser ? currentUser.username : 'Гость') + '</h2>' +
    '<div class="muted">' + (currentUser ? 'Баланс: ' + money(state.balance) : 'Войдите') + '</div></div></div>' +
    (currentUser ? '<button class="add-btn" onclick="logout()">Выйти</button>' : '') + '</div>';
}

function openCase(caseName){
  if(!currentUser) return showInfo('Вход', 'Сначала войдите.');
  var c = CASES.find(function(x){ return x.name === caseName; });
  if(!c) return;
  if(state.balance < c.price) return showInfo('Мало средств', 'Пополните баланс.');
  state.balance -= c.price; state.cases++; saveState();
  var reel = [];
  for(var i = 0; i < 60; i++) reel.push(skinsList[Math.floor(Math.random()*skinsList.length)]);
  var winnerIndex = 55;
  var winner = skinsList[Math.floor(Math.random()*skinsList.length)];
  reel[winnerIndex] = winner;
  state.max = Math.max(state.max, winner[1]);
  var reelEl = document.getElementById('caseReel');
  reelEl.innerHTML = reel.map(function(item, idx){
    return '<div class="reel-item ' + (idx === winnerIndex ? 'winner' : '') + '">' + artImg(item[0]) + '<div class="rname">' + cleanName(item[0]).slice(0,22) + '</div></div>';
  }).join('');
  document.getElementById('caseOverlay').classList.add('show');
  document.getElementById('caseResult').style.display = 'none';
  if(typeof gsap === 'undefined'){
    document.getElementById('caseResult').style.display = 'block';
    document.getElementById('caseItemName').textContent = winner[0];
    document.getElementById('caseItemPrice').textContent = money(winner[1]);
    window._wonItem = winner;
    return;
  }
  var itemWidth = 152;
  var targetX = -(winnerIndex * itemWidth) + (window.innerWidth/2) - (itemWidth/2);
  gsap.fromTo(reelEl, { x: 20 }, { x: targetX, duration: 5, ease: 'power4.out', onComplete: function(){
    document.getElementById('caseResult').style.display = 'block';
    document.getElementById('caseItemName').textContent = winner[0];
    document.getElementById('caseItemPrice').textContent = money(winner[1]);
    window._wonItem = winner;
  }});
}

function collectWin(){
  if(window._wonItem){
    state.inventory.push([window._wonItem[0], '', window._wonItem[1]]);
    state.max = Math.max(state.max, window._wonItem[1]);
    saveState();
    window._wonItem = null;
  }
  document.getElementById('caseOverlay').classList.remove('show');
  go('inventory');
}

function buySkin(i){
  if(!currentUser) return showInfo('Вход', 'Сначала войдите.');
  var x = skinsList[i];
  if(state.balance < x[1]) return showInfo('Мало средств', 'Пополните.');
  state.balance -= x[1];
  state.inventory.push([x[0], '', x[1]]);
  saveState(); go('inventory');
}

function topup(){
  if(!currentUser) return showInfo('Вход', 'Сначала войдите.');
  document.getElementById('genericDialog').innerHTML = '<div class="dialog-head"><h3>Пополнение</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
    '<p class="muted" style="margin-bottom:12px">Выберите сумму:</p><div style="display:flex;gap:8px;flex-wrap:wrap">' +
    [100, 300, 500, 1000, 3000, 5000].map(function(v){ return '<button class="add-btn" style="flex:1;min-width:70px" onclick="startSbp(' + v + ')">' + v + ' ₽</button>'; }).join('') + '</div>';
  openModal('genericModal');
}

function startSbp(amount){
  window.open('https://www.sberbank.com/sms/pbpn?requisiteNumber=79106919694', '_blank');
  setTimeout(function(){
    document.getElementById('genericDialog').innerHTML = '<div class="dialog-head"><h3>Подтверждение</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
      '<p style="margin-bottom:12px">Перевели ' + amount + ' ₽?</p><button class="add-btn" style="width:100%" onclick="confirmDep(' + amount + ')">✅ Я оплатил</button>';
  }, 500);
}

async function confirmDep(amount){
  try{
    var r = await fetch(API + '/api/deposit-request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ user: currentUser.username, amount: amount }) });
    var d = await r.json();
    if(d.ok){ closeModal('genericModal'); showInfo('Заявка отправлена', 'Ожидайте.'); } else showInfo('Ошибка', 'Не удалось.');
  }catch(e){ showInfo('Ошибка', 'Сервер недоступен.'); }
}

function authOpen(){ if(currentUser) return logout(); openModal('authModal'); }

async function doLogin(){
  var u = document.getElementById('authLogin').value.trim();
  var p = document.getElementById('authPass').value;
  try{
    var r = await fetch(API + '/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) });
    var d = await r.json();
    if(d.ok){ authToken = d.token; currentUser = d.user; localStorage.setItem('l1nxs_token', authToken); applyUser(d.user); closeModal('authModal'); go('cases'); }
    else document.getElementById('authMsg').textContent = d.error || 'Ошибка';
  }catch(e){ document.getElementById('authMsg').textContent = 'Сервер недоступен'; }
}

async function doRegister(){
  var u = document.getElementById('authLogin').value.trim();
  var p = document.getElementById('authPass').value;
  try{
    var r = await fetch(API + '/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) });
    var d = await r.json();
    if(d.ok){ authToken = d.token; currentUser = d.user; localStorage.setItem('l1nxs_token', authToken); applyUser(d.user); closeModal('authModal'); go('cases'); }
    else document.getElementById('authMsg').textContent = d.error || 'Ошибка';
  }catch(e){ document.getElementById('authMsg').textContent = 'Сервер недоступен'; }
}

function applyUser(u){
  state.balance = u.balance || 0;
  state.inventory = u.inventory || [];
  state.cases = u.cases || 0;
  state.upgrades = u.upgrades || 0;
  state.max = u.max || 0;
  state.maxBalance = u.maxBalance || 0;
  state.deposited = u.deposited || 0;
  updateBalanceUI();
}

async function loadMe(){
  if(!authToken) return;
  try{
    var r = await fetch(API + '/api/me', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token:authToken}) });
    var d = await r.json();
    if(d.ok){ currentUser = d.user; applyUser(d.user); }
    else { localStorage.removeItem('l1nxs_token'); authToken = null; }
  }catch(e){}
}

async function saveState(){
  if(!authToken) return;
  try{
    await fetch(API + '/api/state', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token:authToken, balance:state.balance, inventory:state.inventory, cases:state.cases, upgrades:state.upgrades, max:state.max}) });
  }catch(e){}
  updateBalanceUI();
}

function logout(){
  localStorage.removeItem('l1nxs_token');
  authToken = null; currentUser = null;
  state = { balance:0, inventory:[], cases:0, upgrades:0, max:0, maxBalance:0, deposited:0 };
  updateBalanceUI(); go('cases');
}

function openMenu(){
  document.getElementById('genericDialog').innerHTML = '<div class="dialog-head"><h3>Меню</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
    nav.map(function(n){ return '<button class="login-pill" style="width:100%;margin-bottom:6px;text-align:left;padding:12px" onclick="closeModal(\'genericModal\');go(\'' + n[0] + '\')">' + n[1] + '</button>'; }).join('') +
    '<button class="login-pill" style="width:100%;margin-top:8px;padding:12px;text-align:left" onclick="closeModal(\'genericModal\');topup()">ПОПОЛНИТЬ</button>' +
    '<button class="login-pill" style="width:100%;margin-top:6px;padding:12px;text-align:left" onclick="closeModal(\'genericModal\');adminOpen()">АДМИНКА</button>';
  openModal('genericModal');
}

function adminOpen(){
  if(adminToken){ openModal('adminModal'); renderAdmin(); return; }
  document.getElementById('genericDialog').innerHTML = '<div class="dialog-head"><h3>Вход в админку</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
    '<p class="muted" style="margin-bottom:12px">Нажмите кнопку — бот пришлёт код в Telegram.</p>' +
    '<button class="add-btn" onclick="adminLoginStart()">Запросить вход</button><div id="adminMsg" class="muted" style="margin-top:8px"></div>';
  openModal('genericModal');
}

async function adminLoginStart(){
  var msg = document.getElementById('adminMsg');
  msg.textContent = 'Проверьте Telegram...';
  try{
    var r = await fetch(API + '/api/admin-login-start', { method:'POST' });
    var d = await r.json();
    if(!d.ok) return msg.textContent = 'Ошибка';
    var code = d.code;
    var tries = 0;
    var check = setInterval(async function(){
      tries++;
      if(tries > 60){ clearInterval(check); msg.textContent = 'Истекло.'; return; }
      var r2 = await fetch(API + '/api/admin-login-check', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({code:code}) });
      var d2 = await r2.json();
      if(d2.ok){
        clearInterval(check);
        adminToken = d2.adminToken;
        localStorage.setItem('l1nxs_admin_token', adminToken);
        closeModal('genericModal');
        openModal('adminModal');
        renderAdmin();
      }
    }, 2000);
  }catch(e){ msg.textContent = 'Сервер недоступен'; }
}

async function renderAdmin(){
  if(!adminToken){ adminOpen(); return; }
  try{
    var r = await fetch(API + '/api/admin/users', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({adminToken:adminToken}) });
    var d = await r.json();
    if(!d.ok){ adminOpen(); return; }
    document.getElementById('adminDialog').innerHTML = '<div style="max-height:60vh;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">' +
      '<thead><tr style="color:#7d8794;text-align:left"><th style="padding:8px">Логин</th><th style="padding:8px">Баланс</th><th style="padding:8px">Кейсы</th><th style="padding:8px">Действия</th></tr></thead><tbody>' +
      d.users.map(function(u){
        return '<tr style="border-bottom:1px solid #1c2028"><td style="padding:8px"><b>' + u.username + '</b></td><td style="padding:8px">' + money(u.balance) + '</td><td style="padding:8px">' + u.cases + '</td>' +
          '<td style="padding:8px"><button style="background:#16a34a;padding:4px 8px;border-radius:4px;font-size:11px" onclick="adminAdd(\'' + u.username + '\',500)">+500</button> ' +
          '<button style="background:#dc2626;padding:4px 8px;border-radius:4px;font-size:11px" onclick="adminAdd(\'' + u.username + '\',-500)">-500</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }catch(e){ showInfo('Ошибка', 'Не удалось загрузить'); }
}

async function adminAdd(username, amount){
  try{
    await fetch(API + '/api/admin/balance', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({adminToken:adminToken, username:username, amount:amount}) });
    renderAdmin();
  }catch(e){}
}

function showInfo(title, text){
  document.getElementById('genericDialog').innerHTML = '<div class="dialog-head"><h3>' + title + '</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
    '<p class="muted">' + text + '</p><button class="add-btn" style="width:100%;margin-top:12px" onclick="closeModal(\'genericModal\')">Закрыть</button>';
  openModal('genericModal');
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal').forEach(function(x){ x.addEventListener('click', function(e){ if(e.target === x) closeModal(x.id); }); });

loadMe();
go('cases');
</script>
