<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L1nxsBattle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{--bg:#0a0c10;--panel:#14171e;--panel2:#1c2029;--line:#2a2f3a;--text:#eef2f7;--muted:#8b95a5;--accent:#ff9a00;--accent2:#ffb84d;--green:#4ade80;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 'Inter',Arial,sans-serif;min-height:100vh}
button{cursor:pointer;border:0;color:#fff;font-family:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.header{position:sticky;top:0;z-index:100;background:rgba(10,12,16,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 20px}
.header-row{max-width:1400px;margin:auto;height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ff9a00,#ff6a00);font-size:18px;font-weight:900}
.brand-name{font-size:18px;font-weight:800;letter-spacing:.5px}
.main-nav{display:flex;gap:4px;flex:1;justify-content:center}
.nav-btn{padding:8px 14px;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;transition:.2s}
.nav-btn:hover{color:#fff}
.nav-btn.active{background:var(--panel2);color:#fff}
.header-actions{display:flex;align-items:center;gap:10px}
.balance{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-weight:600;font-size:13px}
.balance b{color:var(--accent2)}
.add-btn{background:linear-gradient(135deg,#ff9a00,#e68200);padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px}
.login-pill{background:var(--panel2);border:1px solid var(--line);padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px}
.container{max-width:1400px;margin:auto;padding:20px;flex:1}
.section-title{margin:20px 0 12px;font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
.section-title .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.case-art{height:140px;background:radial-gradient(circle at 50% 40%,#2a2f3a,#14171e);display:grid;place-items:center;font-size:56px;position:relative;overflow:hidden}
.case-art img{width:100%;height:100%;object-fit:contain}
.case-name{font-weight:700;padding:10px 12px 4px;font-size:13px}
.case-price{padding:0 12px 12px;color:var(--accent2);font-weight:800;font-size:15px}
.open-btn{display:block;width:100%;padding:10px;background:linear-gradient(135deg,#ff9a00,#e68200);font-weight:700;font-size:13px;border-radius:0 0 12px 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--muted);font-size:12px}
.footer{margin-top:40px;padding:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.dialog{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;max-height:90vh;overflow:auto}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.dialog-head h3{font-size:18px}
.close{width:32px;height:32px;border-radius:8px;background:var(--panel2);color:var(--muted);font-size:18px}
.hidden{display:none!important}
/* Анимация открытия кейса */
.case-opening-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;flex-direction:column;gap:30px}
.case-opening-overlay.show{display:flex}
.case-reel-container{width:100%;overflow:hidden;position:relative;padding:40px 0}
.case-reel-container::before,.case-reel-container::after{content:'';position:absolute;top:0;bottom:0;width:100px;z-index:10;pointer-events:none}
.case-reel-container::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.case-reel-container::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.case-reel{display:flex;gap:12px;padding:0 20px;will-change:transform}
.case-item{flex:0 0 180px;height:140px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
.case-item img{width:80px;height:60px;object-fit:contain}
.case-item.winner{border-color:var(--accent);box-shadow:0 0 30px rgba(255,154,0,.4)}
.case-item .item-label{font-size:10px;font-weight:600;text-align:center;line-height:1.2}
.case-opening-result{text-align:center;padding:0 20px}
.case-opening-result h2{font-size:24px;margin-bottom:8px}
.case-opening-result .item-name{color:var(--accent2);font-size:20px;font-weight:800}
.case-opening-result .item-price{color:var(--muted);margin-top:4px}
/* Мобильная навигация */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:8px;z-index:100}
.mobile-nav-inner{display:grid;grid-template-columns:repeat(6,1fr);gap:4px29}
.mobile-nav button{background:transparent;color:var(--muted);padding:8px 4px;border-radius:8px;font-size:10px;font-weight:600}
.mobile-nav button.active{background:var(--panel2);color:#fff}
@media(max-width:768px){
  .main-nav{display:none}
  .balance{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}
  .mobile-nav{display:block}
  .header-row{height:56px}
  .container{padding-bottom:80px}
}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="header-row">
  <div class="brand" onclick="go('cases')"><div class="brand-mark">LB</div><div class="brand-name">L1nxsBattle</div></div>
  <nav class="main-nav" id="mainNav"></nav>
  <div class="header-actions">
    <div class="balance">Баланс: <b id="balance">0 ₽</b></div>
    <button class="add-btn" onclick="topup()">Пополнить</button>
    <button class="login-pill" id="loginPill" onclick="authOpen()">Войти</button>
  </div>
</div></header>
<main class="container" id="appMain"></main>
<nav class="mobile-nav"><div class="mobile-nav-inner" id="mobileNav"></div></nav>
<footer class="footer">L1nxsBattle © 2018–2026 · <button style="background:var(--panel2);padding:4px 10px;border-radius:6px;font-size:11px;color:#fff" onclick="adminOpen()">Панель управления</button></footer>
</div>

<div class="modal" id="authModal"><div class="dialog"><div class="dialog-head"><h3>Вход / Регистрация</h3><button class="close" onclick="closeModal('authModal')">×</button></div>
<input id="authLogin" placeholder="Логин" style="width:100%;margin-bottom:8px;background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:8px;color:#fff">
<input id="authPass" type="password" placeholder="Пароль" style="width:100%;margin-bottom:12px;background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:8px;color:#fff">
<div style="display:flex;gap:8px"><button class="add-btn" style="flex:1" onclick="doLogin()">Войти</button><button style="flex:1;background:var(--panel2);padding:10px;border-radius:8px;color:#fff" onclick="doRegister()">Регистрация</button></div>
<div id="authMsg" class="muted" style="margin-top:8px"></div>
</div></div>

<div class="modal" id="adminModal"><div class="dialog" style="width:min(900px,100%)"><div class="dialog-head"><h3>Панель управления</h3><button class="close" onclick="closeModal('adminModal')">×</button></div><div id="adminDialog"></div></div></div>

<div class="modal" id="genericModal"><div class="dialog" id="genericDialog"></div></div>

<div class="case-opening-overlay" id="caseOverlay">
  <div class="case-reel-container"><div class="case-reel" id="caseReel"></div></div>
  <div class="case-opening-result" id="caseResult" style="display:none">
    <h2>Вы выиграли!</h2>
    <div class="item-name" id="caseItemName"></div>
    <div class="item-price" id="caseItemPrice"></div>
    <button class="add-btn" style="margin-top:16px" onclick="collectWin()">Забрать предмет</button>
  </div>
</div>

<script>
var SKIN_IMAGES = {};
fetch('https://bymykel.github.io/CSGO-API/api/en/skins.json')
  .then(function(r){ return r.json(); })
  .then(function(data){
    data.forEach(function(s){
      if(s && s.name && s.image){
        SKIN_IMAGES[s.name.toLowerCase().trim()] = s.image;
      }
    });
    console.log('[skins] Загружено:', Object.keys(SKIN_IMAGES).length);
  }).catch(function(e){ console.warn('[skins]', e); });

const money = function(n){ return Math.round(n).toLocaleString('ru-RU') + ' ₽'; };
const artImg = function(name){
  var url = SKIN_IMAGES[String(name).toLowerCase().trim()];
  if(url) return '<img src="' + url + '" alt="' + name + '" loading="lazy">';
  return '<div style="font-size:40px">🎁</div>';
};

var CASES = [
  { name: 'Lonestar', price:  }, { name: 'Valkyra', price: 99 }, { name: 'Manticore', price: 249 },
  { name: 'Kolchia', price: 399 }, { name: 'Wardogs', price: 999 }, { name: 'Эйнштейн', price: 69 },
  { name: 'Менделеев', price: 199 }, { name: 'Дарвин', price: 499 }, { name: 'Гаусс', price: 1999 },
  { name: 'Коперник', price: 5999 }, { name: 'Джин Грей', price: 39 }, { name: 'Скорпион', price: 89 },
  { name: 'Каратель', price: 299 }, { name: 'Халк', price: 799 }, { name: 'Человек-Паук', price: 1999 },
  { name: 'Неймар', price: 49 }, { name: 'Месси', price: 149 }, { name: 'Роналду', price: 449 },
  { name: 'Мбаппе', price: 1349 }, { name: 'Ямаль', price: 4049 }
];

var skinsList = [
  ['Karambit | Doppler', 78450], ['Butterfly Knife | Fade', 62300], ['M9 Bayonet | Crimson Web', 48200],
  ['Bayonet | Marble Fade', 55700], ['Flip Knife | Lore', 42800], ['AWP | Dragon Lore', 1250000],
  ['AK-47 | Fire Serpent', 36000], ['M4A4 | Howl', 480000], ['AK-47 | Redline', 2850],
  ['AK-47 | Vulcan', 3250], ['AWP | Asiimov', 4750], ['M4A1-S | Hyper Beast', 2980],
  ['Glock-18 | Fade', 12300], ['USP-S | Kill Confirmed', 2450], ['Desert Eagle | Printstream', 3990],
  ['P250 | See Ya Later', 1120], ['FAMAS | Commemoration', 1890], ['MP9 | Starlight Protector', 980],
  ['MAC-10 | Neon Rider', 2650], ['P90 | Asiimov', 1750], ['SSG 08 | Dragonfire', 1980],
  ['Gloves | Pandora Box', 420000], ['Gloves | Vice', 215000]
];

var currentUser = null;
var authToken = localStorage.getItem('l1nxs_token') || null;
var adminToken = localStorage.getItem('l1nxs_admin_token') || null;
var state = { balance: 0, inventory: [], cases: 0, upgrades: 0, max: 0 };
var API = 'https://l1nxs-bot.longyxs999.workers.dev';

var nav = [['cases','Кейсы','CASE'],['shop','Магазин','SHOP'],['inventory','Инвентарь','INV'],['account','Профиль','PROFILE']];

function setupNav(active){
  document.getElementById('mainNav').innerHTML = nav.map(function(n){
    return '<button class="nav-btn ' + (active === n[0] ? 'active' : '') + '" onclick="go(\'' + n[0] + '\')">' + n[2] + ' ' + n[1] + '</button>';
  }).join('');
  document.getElementById('mobileNav').innerHTML = nav.map(function(n){
    return '<button class="' + (active === n[0] ? 'active' : '') + '" onclick="go(\'' + n[0] + '\')">' + n[2] + '<br>' + n[1] + '</button>';
  }).join('');
}

function go(page){
  setupNav(page);
  var m = document.getElementById('appMain');
  if(page === 'cases') renderCases(m);
  else if(page === 'shop') renderShop(m);
  else if(page === 'inventory') renderInventory(m);
  else renderAccount(m);
  updateBalanceUI();
  window.scrollTo({top:0, behavior:'smooth'});
}

function updateBalanceUI(){
  document.getElementById('balance').textContent = money(state.balance);
  document.getElementById('loginPill').textContent = currentUser ? currentUser.username : 'Войти';
}

function renderCases(m){
  m.innerHTML = '<div class="section-title"><span class="dot"></span> Кейсы</div><div class="grid">' +
    CASES.map(function(c){
      return '<div class="card"><div class="case-art">' + artImg(c.name) + '</div><div class="case-name">' + c.name + '</div><div class="case-price">' + money(c.price) + '</div><button class="open-btn" onclick="openCase(\'' + c.name + '\')">Открыть</button></div>';
    }).join('') + '</div>';
}

function renderShop(m){
  m.innerHTML = '<div class="section-title"><span class="dot"></span> Магазин скинов</div><div class="grid">' +
    skinsList.map(function(x, i){
      return '<div class="card"><div class="case-art">' + artImg(x[0]) + '</div><div class="case-name">' + x[0] + '</div><div class="case-price">' + money(x[1]) + '</div><button class="open-btn" onclick="buySkin(' + i + ')">Купить</button></div>';
    }).join('') + '</div>';
}

function renderInventory(m){
  m.innerHTML = '<div class="section-title"><span class="dot"></span> Инвентарь (' + state.inventory.length + ')</div>' +
    (state.inventory.length ? '<div class="grid">' + state.inventory.map(function(x){
      return '<div class="card"><div class="case-art">' + artImg(x[0]) + '</div><div class="case-name">' + x[0] + '</div><div class="case-price">' + money(x[2]) + '</div></div>';
    }).join('') + '</div>' : '<div class="panel"><div class="muted">Инвентарь пуст.</div></div>');
}

function renderAccount(m){
  m.innerHTML = '<div class="panel"><div style="display:flex;align-items:center;gap:12px;margin-bottom:20px"><div style="width:48px;height:48px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:20px;font-weight:800">' + (currentUser ? currentUser.username.slice(0,2).toUpperCase() : '?') + '</div><div><h2 style="margin:0;font-size:18px">' + (currentUser ? currentUser.username : 'Гость') + '</h2><div class="muted">' + (currentUser ? 'Баланс: ' + money(state.balance) : 'Войдите, чтобы играть') + '</div></div></div>' +
    (currentUser ? '<button class="add-btn" onclick="logout()">Выйти</button>' : '') + '</div>';
}

function openCase(caseName){
  if(!currentUser) return showInfo('Вход', 'Сначала войдите в аккаунт.');
  var c = CASES.find(function(x){ return x.name === caseName; });
  if(!c) return;
  if(state.balance < c.price) return showInfo('Мало средств', 'Пополните баланс.');

  state.balance -= c.price;
  state.cases++;
  saveState();

  var reel = [];
  for(var i = 0; i < 60; i++){
    reel.push(skinsList[Math.floor(Math.random() * skinsList.length)]);
  }
  var winnerIndex = 55;
  var winner = skinsList[Math.floor(Math.random() * skinsList.length)];
  reel[winnerIndex] = winner;
  state.max = Math.max(state.max, winner[1]);

  var reelEl = document.getElementById('caseReel');
  reelEl.innerHTML = reel.map(function(item, idx){
    return '<div class="case-item ' + (idx === winnerIndex ? 'winner' : '') + '">' + artImg(item[0]) + '<div class="item-label">' + item[0] + '</div></div>';
  }).join('');

  document.getElementById('caseOverlay').classList.add('show');
  document.getElementById('caseResult').style.display = 'none';

  if(typeof gsap === 'undefined'){
    var idx = winnerIndex;
    document.getElementById('caseResult').style.display = 'block';
    document.getElementById('caseItemName').textContent = winner[0];
    document.getElementById('caseItemPrice').textContent = money(winner[1]);
    window._wonItem = winner;
    return;
  }

  var itemWidth = 192;
  var containerWidth = window.innerWidth;
  var targetX = -(winnerIndex * itemWidth) + (containerWidth / 2) - (itemWidth / 2);

  gsap.fromTo(reelEl, { x: 20 }, {
    x: targetX,
    duration: 5,
    ease: 'power4.out',
    onComplete: function(){
      document.getElementById('caseResult').style.display = 'block';
      document.getElementById('caseItemName').textContent = winner[0];
      document.getElementById('caseItemPrice').textContent = money(winner[1]);
      window._wonItem = winner;
    }
  });
}

function collectWin(){
  if(window._wonItem){
    state.inventory.push([window._wonItem[0], '', window._wonItem[1]]);
    state.max = Math.max(state.max, window._wonItem[1]);
    saveState();
    window._wonItem = null;
  }
  document.getElementById('caseOverlay').classList.remove('show');
  go('inventory');
}

function buySkin(i){
  if(!currentUser) return showInfo('Вход', 'Сначала войдите.');
  var x = skinsList[i];
  if(state.balance < x[1]) return showInfo('Мало средств', 'Пополните.');
  state.balance -= x[1];
  state.inventory.push([x[0], '', x[1]]);
  saveState();
  go('inventory');
}

function topup(){
  if(!currentUser) return showInfo('Вход', 'Сначала войдите.');
  document.getElementById('genericDialog').innerHTML = '<div class="dialog-head"><h3>Пополнение</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
    '<p class="muted" style="margin-bottom:12px">Выберите сумму:</p>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    [100, 300, 500, 1000, 3000, 5000].map(function(v){
      return '<button class="add-btn" style="flex:1;min-width:80px" onclick="startSbp(' + v + ')">' + v + ' ₽</button>';
    }).join('') + '</div>';
  openModal('genericModal');
}

function startSbp(amount){
  window.open('https://www.sberbank.com/sms/pbpn?requisiteNumber=79106919694', '_blank');
  setTimeout(function(){
    document.getElementById('genericDialog').innerHTML = '<div class="dialog-head"><h3>Подтверждение</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
      '<p style="margin-bottom:12px">Перевели ' + amount + ' ₽?</p>' +
      '<button class="add-btn" style="width:100%" onclick="confirmDep(' + amount + ')">✅ Я оплатил</button>';
  }, 500);
}

async function confirmDep(amount){
  try{
    var r = await fetch(API + '/api/deposit-request', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user: currentUser.username, amount: amount })
    });
    var d = await r.json();
    if(d.ok){ closeModal('genericModal'); showInfo('Заявка отправлена', 'Ожидайте подтверждения.'); }
    else showInfo('Ошибка', 'Не удалось.');
  }catch(e){ showInfo('Ошибка', 'Сервер недоступен.'); }
}

function authOpen(){ if(currentUser) return logout(); openModal('authModal'); }

async function doLogin(){
  var u = document.getElementById('authLogin').value.trim();
  var p = document.getElementById('authPass').value;
  try{
    var r = await fetch(API + '/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) });
    var d = await r.json();
    if(d.ok){ authToken = d.token; currentUser = d.user; localStorage.setItem('l1nxs_token', authToken); applyUser(d.user); closeModal('authModal'); go('cases'); }
    else document.getElementById('authMsg').textContent = d.error || 'Ошибка';
  }catch(e){ document.getElementById('authMsg').textContent = 'Сервер недоступен'; }
}

async function doRegister(){
  var u = document.getElementById('authLogin').value.trim();
  var p = document.getElementById('authPass').value;
  try{
    var r = await fetch(API + '/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) });
    var d = await r.json();
    if(d.ok){ authToken = d.token; currentUser = d.user; localStorage.setItem('l1nxs_token', authToken); applyUser(d.user); closeModal('authModal'); go('cases'); }
    else document.getElementById('authMsg').textContent = d.error || 'Ошибка';
  }catch(e){ document.getElementById('authMsg').textContent = 'Сервер недоступен'; }
}

function applyUser(u){
  state.balance = u.balance || 0;
  state.inventory = u.inventory || [];
  state.cases = u.cases || 0;
  state.upgrades = u.upgrades || 0;
  state.max = u.max || 0;
  updateBalanceUI();
}

async function loadMe(){
  if(!authToken) return;
  try{
    var r = await fetch(API + '/api/me', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token:authToken}) });
    var d = await r.json();
    if(d.ok){ currentUser = d.user; applyUser(d.user); }
    else { localStorage.removeItem('l1nxs_token'); authToken = null; }
  }catch(e){}
}

async function saveState(){
  if(!authToken) return;
  try{
    await fetch(API + '/api/state', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token:authToken, balance:state.balance, inventory:state.inventory, cases:state.cases, upgrades:state.upgrades, max:state.max})
    });
  }catch(e){}
  updateBalanceUI();
}

function logout(){
  localStorage.removeItem('l1nxs_token');
  authToken = null; currentUser = null;
  state = { balance:0, inventory:[], cases:0, upgrades:0, max:0 };
  updateBalanceUI(); go('cases');
}

function adminOpen(){
  if(adminToken){ openModal('adminModal'); renderAdmin(); return; }
  document.getElementById('genericDialog').innerHTML = '<div class="dialog-head"><h3>Вход в админку</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
    '<p class="muted" style="margin-bottom:12px">Нажмите кнопку — бот пришлёт код в Telegram.</p>' +
    '<button class="add-btn" onclick="adminLoginStart()">Запросить вход</button>' +
    '<div id="adminMsg" class="muted" style="margin-top:8px"></div>';
  openModal('genericModal');
}

async function adminLoginStart(){
  var msg = document.getElementById('adminMsg');
  msg.textContent = 'Запрос отправлен. Проверьте Telegram...';
  try{
    var r = await fetch(API + '/api/admin-login-start', { method:'POST' });
    var d = await r.json();
    if(!d.ok) return msg.textContent = 'Ошибка';
    var code = d.code;
    var tries = 0;
    var check = setInterval(async function(){
      tries++;
      if(tries > 60){ clearInterval(check); msg.textContent = 'Истекло время.'; return; }
      var r2 = await fetch(API + '/api/admin-login-check', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({code:code}) });
      var d2 = await r2.json();
      if(d2.ok){
        clearInterval(check);
        adminToken = d2.adminToken;
        localStorage.setItem('l1nxs_admin_token', adminToken);
        closeModal('genericModal');
        openModal('adminModal');
        renderAdmin();
      }
    }, 2000);
  }catch(e){ msg.textContent = 'Сервер недоступен'; }
}

async function renderAdmin(){
  if(!adminToken){ adminOpen(); return; }
  try{
    var r = await fetch(API + '/api/admin/users', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({adminToken:adminToken}) });
    var d = await r.json();
    if(!d.ok){ adminOpen(); return; }
    document.getElementById('adminDialog').innerHTML = '<div style="max-height:60vh;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">' +
      '<thead><tr style="color:var(--muted);text-align:left"><th style="padding:8px">Логин</th><th style="padding:8px">Баланс</th><th style="padding:8px">Кейсы</th><th style="padding:8px">Апгрейды</th><th style="padding:8px">Действия</th></tr></thead><tbody>' +
      d.users.map(function(u){
        return '<tr style="border-bottom:1px solid var(--line)"><td style="padding:8px"><b>' + u.username + '</b></td><td style="padding:8px">' + money(u.balance) + '</td><td style="padding:8px">' + u.cases + '</td><td style="padding:8px">' + u.upgrades + '</td>' +
          '<td style="padding:8px"><button style="background:var(--green);padding:4px 8px;border-radius:6px;font-size:11px;color:#fff" onclick="adminAdd(\'' + u.username + '\',500)">+500</button> ' +
          '<button style="background:var(--red);padding:4px 8px;border-radius:6px;font-size:11px;color:#fff" onclick="adminAdd(\'' + u.username + '\',-500)">-500</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }catch(e){ showInfo('Ошибка', 'Не удалось загрузить'); }
}

async function adminAdd(username, amount){
  try{
    await fetch(API + '/api/admin/balance', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({adminToken:adminToken, username:username, amount:amount}) });
    renderAdmin();
  }catch(e){}
}

function showInfo(title, text){
  document.getElementById('genericDialog').innerHTML = '<div class="dialog-head"><h3>' + title + '</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
    '<p class="muted">' + text + '</p><button class="add-btn" style="width:100%;margin-top:12px" onclick="closeModal(\'genericModal\')">Закрыть</button>';
  openModal('genericModal');
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal').forEach(function(x){ x.addEventListener('click', function(e){ if(e.target === x) closeModal(x.id); }); });

loadMe();
go('cases');
</script>
</body>
</html>
