*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e1116;color:#fff;font:14px/1.4 Arial,sans-serif;min-height:100vh}
button{cursor:pointer;border:0;color:#fff;font-family:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.header{background:#0e1116;border-bottom:1px solid #1c2028;padding:12px 16px;position:sticky;top:0;z-index:100}
.header-row{max-width:1400px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo-block{display:flex;flex-direction:column;cursor:pointer}
.logo-top{font-size:20px;font-weight:900;letter-spacing:1px;line-height:1}
.logo-top .g{color:#ff6a00}
.logo-sub{font-size:9px;color:#8a94a3;letter-spacing:2px;text-transform:uppercase;margin-top:2px}

.online{display:flex;align-items:center;gap:4px;color:#4ade80;font-weight:700;font-size:13px}
.online svg{width:16px;height:16px}
.balance{padding:6px 10px;background:#181c23;border-radius:6px;font-size:12px;font-weight:600}
.balance b{color:#ff9a00}
.menu-btn{background:transparent;padding:4px;display:grid;place-items:center}
.menu-btn svg{width:24px;height:24px;stroke:#ff6a00;stroke-width:2.5;fill:none}
.container{max-width:1400px;margin:auto;padding:16px;flex:1;width:100%}
.section-title{margin:16px 0 12px;font-size:15px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.cases-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.case-card{background:#141820;border-radius:10px;padding:10px;display:flex;flex-direction:column;transition:.2s}
.case-card:hover{background:#1a1f29}
.case-img-box{width:100%;aspect-ratio:1.1;display:grid;place-items:center;padding:6px;background:#0e1116;border-radius:8px;overflow:hidden}
.case-img-box img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
.case-name-top{font-weight:900;font-size:13px;color:#fff;text-transform:uppercase;margin-top:8px;line-height:1.2;text-align:center;min-height:32px}
.case-items-row{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:4px}
.case-items-count{font-size:11px;color:#7d8794}
.badge-new{background:#dc2626;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px}
.case-price-box{margin:10px auto;border:1.5px solid #ff6a00;border-radius:4px;padding:5px 20px;font-size:13px;font-weight:800;color:#ff6a00;background:#0e1116;text-align:center;min-width:90px;width:fit-content}
.case-open-btn{background:linear-gradient(135deg,#ff8c00,#e65c00);padding:9px;border-radius:6px;font-weight:800;font-size:12px;letter-spacing:.5px;text-transform:uppercase;width:100%}
.skins-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.skin-card{background:#141820;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.skin-card:hover{background:#1a1f29}
.skin-img-box{width:100%;aspect-ratio:1.4;display:grid;place-items:center;padding:14px;position:relative;background:radial-gradient(circle at 50% 40%,#1a1f29,#0e1116)}
.skin-img-box img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.skin-price-tag{position:absolute;top:8px;left:8px;background:#1c2028;border:1px solid #ff6a00;color:#ff9a00;font-size:11px;font-weight:800;padding:3px 8px;border-radius:4px}
.skin-info{padding:8px 10px 10px}
.skin-name{font-size:12px;font-weight:700;color:#fff;line-height:1.3}
.skin-name .st{color:#cf5cff}
.skin-bottom-line{height:3px;width:100%}
.footer{margin-top:40px;padding:20px;border-top:1px solid #1c2028;color:#5d6672;font-size:11px;text-align:center}
.panel{background:#141820;border-radius:10px;padding:18px;margin-top:16px}
.muted{color:#7d8794;font-size:12px}
.add-btn{background:linear-gradient(135deg,#ff8c00,#e65c00);padding:9px 16px;border-radius:6px;font-weight:700;font-size:13px}
.login-pill{background:#1c2028;padding:9px 16px;border-radius:6px;font-weight:600;font-size:13px}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#141820;border-top:1px solid #1c2028;padding:6px;z-index:100}
.mobile-nav-inner{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mobile-nav button{background:transparent;color:#7d8794;padding:6px 4px;border-radius:6px;font-size:10px;font-weight:600}
.mobile-nav button.active{background:#1c2028;color:#ff9a00}
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.dialog{width:min(500px,100%);background:#141820;border-radius:12px;padding:20px;max-height:90vh;overflow:auto;border:1px solid #1c2028}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dialog-head h3{font-size:16px;text-transform:uppercase}
.close{width:30px;height:30px;border-radius:6px;background:#1c2028;color:#8a94a3;font-size:16px}
.input{width:100%;background:#0e1116;border:1px solid #2a3038;padding:11px;border-radius:6px;color:#fff;margin-bottom:10px}
.case-opening-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}

.reel-container{width:100%;overflow:hidden;position:relative;padding:30px 0}
.reel{display:flex;gap:12px;padding:0 20px;will-change:transform}
.reel-item{flex:0 0 140px;height:120px;background:#1a1f29;border:2px solid #2a3038;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}

.upg-slot{text-align:center;background:#0e1116;border-radius:10px;padding:10px}

.upg-slot .pr{color:#ff9a00;font-weight:800;font-size:12px;margin-top:2px}
.upg-wheel{position:relative;width:150px;height:150px;margin:auto}
.upg-circle{width:100%;height:100%;border-radius:50%;background:conic-gradient(#22c55e 0% var(--ch),#ef4444 var(--ch) 100%);position:relative;box-shadow:0 0 30px rgba(0,0,0,.5)}
.upg-circle::after{content:'';position:absolute;inset:14px;border-radius:50%;background:#0e1116;box-shadow:inset 0 0 20px #000}
.upg-needle{position:absolute;left:50%;top:50%;width:3px;height:60px;background:linear-gradient(#fff,#ff9a00);border-radius:3px;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);z-index:5;box-shadow:0 0 10px #ff9a00}

.upg-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;text-align:center;background:#0e1116;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;border:1px solid #2a3038}

.hidden{display:none!important}

@media(max-width:767px){.mobile-nav{display:block}.container{padding-bottom:70px}.logo-top{font-size:16px}.online{font-size:11px}.upgrade-stage{grid-template-columns:1fr 1fr;gap:10px}.upg-wheel{grid-column:1/-1;order:-1}}

    data.forEach(function(s){
      if(s && s.name && s.image){
        SKIN_IMAGES[s.name.toLowerCase().trim()] = s.image;
        var noStar = s.name.replace(/^★\s*/,'').toLowerCase().trim();
        if(!SKIN_IMAGES[noStar]) SKIN_IMAGES[noStar] = s.image;
      }
    });
  }).catch(function(e){ console.warn(e); });

var CASE_IMAGES = {};

function artImg(name){
  var raw = String(name).toLowerCase().trim();
  var noStar = raw.replace(/^★\s*/,'').trim();
  var url = SKIN_IMAGES[raw] || SKIN_IMAGES[noStar];
  if(url) return '<img src="' + url + '" alt="" loading="lazy">';
  return '<div style="font-size:36px;opacity:.3">🎁</div>';
}

function svgCase(name){
  var hue = (Array.from(name).reduce(function(a,c){return a+c.charCodeAt(0)},0)*17)%360;
  var h2 = (hue + 35) % 360;
  var label = name.toUpperCase().slice(0, 12);

    '<line x1="60" y1="72" x2="60" y2="158" stroke="#000" stroke-opacity=".25" stroke-width="3"/>' +
    '<line x1="180" y1="72" x2="180" y2="158" stroke="#000" stroke-opacity=".25" stroke-width="3"/>' +

    '<text x="120" y="116" text-anchor="middle" fill="#fff" font-size="13" font-family="Arial" font-weight="900">' + label + '</text></svg>';
}

function caseArt(name){
  var key = String(name).toLowerCase().trim();
  if(CASE_IMAGES[key]) return '<img src="' + CASE_IMAGES[key] + '" alt="">';
  return svgCase(name);
}

function hasStatTrak(name){ return /StatTrak/i.test(name); }
function cleanName(name){ return name.replace(/^StatTrak™\s*/i, ''); }
function rarityColor(name){
  if(/Knife|Karambit|Bayonet|Doppler|Fade|Lore|Marble|Tiger|Slaughter|Case Hardened/i.test(name)) return '#eb4b4b';

// ===== Апгрейд логика =====
function calcChance(from, to){
  if(!from || !to) return 0;
  if(to <= from) return 80;
  return Math.max(1, Math.min(80, (from / to) * 100));
}

function updateChance(){
  var a = document.getElementById('upFrom'), b = document.getElementById('upTo');
  if(!a || !b) return;
  var ce = document.getElementById('chance'), mu = document.getElementById('multi'), bar = document.getElementById('chanceBar');
  if(a.value === '' || b.value === ''){ ce.textContent = '0%'; mu.textContent = ''; bar.style.width = '0%'; return; }
  var from = state.inventory[Number(a.value)];
  var to = skinsList[Number(b.value)];
  if(!from || !to){ ce.textContent = '0%'; return; }
  var c = calcChance(from[2], to[1]);
  ce.textContent = c.toFixed(2) + '%';
  mu.textContent = 'Множитель ×' + (to[1]/from[2]).toFixed(2);
  bar.style.width = c + '%';
}

function doUpgrade(){
  var a = document.getElementById('upFrom'), b = document.getElementById('upTo');
  if(!a || !b || a.value === '' || b.value === '') return showInfo('Апгрейд','Выберите предмет и цель.');
  var i = Number(a.value);
  var from = state.inventory[i];
  var target = skinsList[Number(b.value)];
  var chance = calcChance(from[2], target[1]);
  var success = Math.random() * 100 < chance;
  var finalAngle = success ? (Math.random() * chance * 3.6) : (chance * 3.6 + Math.random() * (360 - chance * 3.6));
  document.getElementById('genericDialog').innerHTML =
    '<div class="dialog-head"><h3>Апгрейд</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
    '<div class="upgrade-stage">' +
    '<div class="upg-slot"><h4>ВАШ</h4><div class="img">' + artImg(from[0]) + '</div><div class="nm">' + cleanName(from[0]).slice(0,20) + '</div><div class="pr">' + money(from[2]) + '</div></div>' +
    '<div class="upg-wheel"><div class="upg-circle" style="--ch:' + chance + '%"></div><div class="upg-needle" id="upgNeedle"></div><div class="upg-center"><b>' + chance.toFixed(1) + '%</b></div></div>' +
    '<div class="upg-slot"><h4>ЦЕЛЬ</h4><div class="img">' + artImg(target[0]) + '</div><div class="nm">' + cleanName(target[0]).slice(0,20) + '</div><div class="pr">' + money(target[1]) + '</div></div>' +
    '</div><div id="upgStatus" style="text-align:center;color:#7d8794;font-size:12px">Крутим...</div>' +
    '<button id="upgBtn" class="add-btn" style="width:100%;margin-top:14px;padding:14px" disabled>Ожидание...</button>';
  openModal('genericModal');

  setTimeout(function(){
    var needle = document.getElementById('upgNeedle');
    if(!needle) return;
    needle.style.transition = 'transform 4s cubic-bezier(.1,.8,.2,1)';
    needle.style.transform = 'translate(-50%,-100%) rotate(' + (finalAngle + 1440) + 'deg)';
  }, 100);

  setTimeout(function(){
    var status = document.getElementById('upgStatus'), btn = document.getElementById('upgBtn');
    if(!status || !btn) return;
    if(success){
      state.inventory[i] = [target[0], '', target[1]];
      state.upgrades++;
      status.innerHTML = '<b style="color:#22c55e;font-size:15px">✅ УСПЕХ! ' + cleanName(target[0]) + '</b>';
    } else {
      state.inventory.splice(i, 1);
      state.upgrades++;
      status.innerHTML = '<b style="color:#ef4444;font-size:15px">❌ ПРЕДМЕТ СГОРЕЛ</b>';
    }
    saveState();
    btn.disabled = false;
    btn.textContent = 'Продолжить';
    btn.onclick = function(){ closeModal('genericModal'); go('upgrade'); };
  }, 4300);
}

// ===== Кейсы =====
function openCase(caseName){
  if(!currentUser) return showInfo('Вход','Сначала войдите.');
  var c = CASES.find(function(x){ return x.name === caseName; });
  if(!c) return;
  if(state.balance < c.price) return showInfo('Мало средств','Пополните баланс.');
  state.balance -= c.price; state.cases++; saveState();
  var reel = [];
  for(var i = 0; i < 60; i++) reel.push(skinsList[Math.floor(Math.random()*skinsList.length)]);
  var winnerIndex = 55;
  var winner = skinsList[Math.floor(Math.random()*skinsList.length)];
  reel[winnerIndex] = winner;
  state.max = Math.max(state.max, winner[1]);
  var reelEl = document.getElementById('caseReel');
  reelEl.innerHTML = reel.map(function(item, idx){
    return '<div class="reel-item ' + (idx === winnerIndex ? 'winner' : '') + '">' + artImg(item[0]) + '<div class="rname">' + cleanName(item[0]).slice(0,22) + '</div></div>';
  }).join('');
  document.getElementById('caseOverlay').classList.add('show');
  document.getElementById('caseResult').style.display = 'none';
  if(typeof gsap === 'undefined'){
    document.getElementById('caseResult').style.display = 'block';
    document.getElementById('caseItemName').textContent = winner[0];
    document.getElementById('caseItemPrice').textContent = money(winner[1]);
    window._wonItem = winner;
    return;
  }
  var targetX = -(winnerIndex * 152) + (window.innerWidth/2) - 76;
  gsap.fromTo(reelEl, { x: 20 }, { x: targetX, duration: 5, ease: 'power4.out', onComplete: function(){
    document.getElementById('caseResult').style.display = 'block';
    document.getElementById('caseItemName').textContent = winner[0];
    document.getElementById('caseItemPrice').textContent = money(winner[1]);
    window._wonItem = winner;
  }});
}

function collectWin(){
  if(window._wonItem){
    state.inventory.push([window._wonItem[0], '', window._wonItem[1]]);
    state.max = Math.max(state.max, window._wonItem[1]);
    saveState();
    window._wonItem = null;
  }
  document.getElementById('caseOverlay').classList.remove('show');
  go('inventory');
}

function buySkin(i){
  if(!currentUser) return showInfo('Вход','Сначала войдите.');
  var x = skinsList[i];
  if(state.balance < x[1]) return showInfo('Мало средств','Пополните.');
  state.balance -= x[1];
  state.inventory.push([x[0], '', x[1]]);
  saveState(); go('inventory');
}

    var r = await fetch(API + '/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) });
    var d = await r.json();
    if(d.ok){ authToken = d.token; currentUser = d.user; localStorage.setItem('l1nxs_token', authToken); applyUser(d.user); closeModal('authModal'); go('cases'); }
    else document.getElementById('authMsg').textContent = d.error || 'Ошибка';
  }catch(e){ document.getElementById('authMsg').textContent = 'Сервер недоступен'; }
}

function applyUser(u){
  state.balance = u.balance || 0;
  state.inventory = u.inventory || [];
  state.cases = u.cases || 0;
  state.upgrades = u.upgrades || 0;
  state.max = u.max || 0;
  state.maxBalance = u.maxBalance || 0;
  state.deposited = u.deposited || 0;
  updateBalanceUI();
}

async function loadMe(){
  if(!authToken) return;
  try{
    var r = await fetch(API + '/api/me', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token:authToken}) });
    var d = await r.json();
    if(d.ok){ currentUser = d.user; applyUser(d.user); }
    else { localStorage.removeItem('l1nxs_token'); authToken = null; }
  }catch(e){}
}

async function saveState(){
  if(!authToken) return;
  try{
    await fetch(API + '/api/state', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token:authToken, balance:state.balance, inventory:state.inventory, cases:state.cases, upgrades:state.upgrades, max:state.max}) });
  }catch(e){}
  updateBalanceUI();
}

function logout(){
  localStorage.removeItem('l1nxs_token');
  authToken = null; currentUser = null;
  state = { balance:0, inventory:[], cases:0, upgrades:0, max:0, maxBalance:0, deposited:0 };
  updateBalanceUI(); go('cases');
}

// ===== Меню =====
function openMenu(){
  document.getElementById('genericDialog').innerHTML =
    '<div class="dialog-head"><h3>Меню</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
    nav.map(function(n){ return '<button class="login-pill" style="width:100%;margin-bottom:6px;text-align:left;padding:12px" onclick="closeModal(\'genericModal\');go(\'' + n[0] + '\')">' + n[1] + '</button>'; }).join('') +
    '<button class="login-pill" style="width:100%;margin-top:8px;padding:12px;text-align:left" onclick="closeModal(\'genericModal\');topup()">ПОПОЛНИТЬ</button>' +
    '<a href="https://t.me/ZloyDonk666" target="_blank" class="login-pill" style="display:block;width:100%;margin-top:6px;padding:12px;text-align:left;text-decoration:none;color:#ff9a00">💬 ПОДДЕРЖКА</a>' +
    '<button class="login-pill" style="width:100%;margin-top:6px;padding:12px;text-align:left" onclick="closeModal(\'genericModal\');adminOpen()">АДМИНКА</button>';
  openModal('genericModal');
}

// ===== Админка =====
function adminOpen(){
  if(adminToken){ openModal('adminModal'); renderAdmin(); return; }
  document.getElementById('genericDialog').innerHTML = '<div class="dialog-head"><h3>Вход в админку</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
    '<p class="muted" style="margin-bottom:12px">Нажмите кнопку — бот пришлёт код в Telegram.</p>' +
    '<button class="add-btn" onclick="adminLoginStart()">Запросить вход</button><div id="adminMsg" class="muted" style="margin-top:8px"></div>';
  openModal('genericModal');
}

async function adminLoginStart(){
  var msg = document.getElementById('adminMsg');
  msg.textContent = 'Проверьте Telegram...';
  try{
    var r = await fetch(API + '/api/admin-login-start', { method:'POST' });
    var d = await r.json();
    if(!d.ok) return msg.textContent = 'Ошибка';
    var code = d.code, tries = 0;
    var check = setInterval(async function(){
      tries++;
      if(tries > 60){ clearInterval(check); msg.textContent = 'Истекло.'; return; }
      var r2 = await fetch(API + '/api/admin-login-check', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({code:code}) });
      var d2 = await r2.json();
      if(d2.ok){ clearInterval(check); adminToken = d2.adminToken; localStorage.setItem('l1nxs_admin_token', adminToken); closeModal('genericModal'); openModal('adminModal'); renderAdmin(); }
    }, 2000);
  }catch(e){ msg.textContent = 'Сервер недоступен'; }
}

function switchAdminTab(t){ adminTab = t; renderAdmin(); }

async function renderAdmin(){
  if(!adminToken){ adminOpen(); return; }
  var box = document.getElementById('adminDialog');
  if(adminTab === 'players') return renderAdminPlayers(box);
  if(adminTab === 'promo') return renderAdminPromo(box);
}

async function renderAdminPlayers(box){
  box.innerHTML = '<div class="admin-tabs"><button class="active" onclick="switchAdminTab(\'players\')">ИГРОКИ</button><button onclick="switchAdminTab(\'promo\')">ПРОМОКОДЫ</button></div><div class="muted">Загрузка...</div>';
  try{
    var r = await fetch(API + '/api/admin/users', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({adminToken:adminToken}) });
    var d = await r.json();
    if(!d.ok){ adminOpen(); return; }
    box.innerHTML = '<div class="admin-tabs"><button class="active" onclick="switchAdminTab(\'players\')">ИГРОКИ</button><button onclick="switchAdminTab(\'promo\')">ПРОМОКОДЫ</button></div>' +
      '<div style="max-height:65vh;overflow:auto">' +
      d.users.map(function(u){
        return '<div class="admin-player">' +
          '<div class="admin-player-name">' + u.username + '</div>' +
          '<div class="admin-player-stats">💰 ' + money(u.balance) + ' · 🎁 ' + (u.inventory ? u.inventory.length : 0) + ' скинов · 📦 ' + u.cases + ' · ⬆ ' + u.upgrades + '</div>' +
          '<div class="admin-player-actions">' +
          '<button style="background:#16a34a" onclick="adminBalance(\'' + u.username + '\',1)">+ Баланс</button>' +
          '<button style="background:#dc2626" onclick="adminBalance(\'' + u.username + '\',-1)">− Баланс</button>' +
          '<button style="background:#2563eb" onclick="adminGiveSkin(\'' + u.username + '\')">+ Скин</button>' +
          '<button style="background:#7c3aed" onclick="adminManageInv(\'' + u.username + '\')">Инвентарь</button>' +
          '</div></div>';
      }).join('') + '</div>';
  }catch(e){ box.innerHTML = '<div class="admin-tabs"><button class="active">ИГРОКИ</button><button onclick="switchAdminTab(\'promo\')">ПРОМОКОДЫ</button></div><div class="muted">Ошибка.</div>'; }
}

async function adminBalance(username, dir){
  var label = dir > 0 ? 'Какую сумму НАЧИСЛИТЬ?' : 'Какую сумму СПИСАТЬ?';
  var v = prompt(label + '\nИгрок: ' + username, '500');
  if(v === null) return;
  var amount = Number(v);
  if(!Number.isFinite(amount) || amount <= 0) return showInfo('Ошибка','Введите корректную сумму.');
  try{
    await fetch(API + '/api/admin/balance', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({adminToken:adminToken, username:username, amount:amount * dir}) });
    renderAdmin();
  }catch(e){}
}

function adminGiveSkin(username){
  var list = skinsList.map(function(x, i){ return (i+1) + '. ' + x[0] + ' — ' + money(x[1]); }).join('\n');
  var v = prompt('Введите НОМЕР скина из списка:\n\n' + list, '1');
  if(v === null) return;
  var idx = Number(v) - 1;
  if(idx < 0 || idx >= skinsList.length) return showInfo('Ошибка','Неверный номер.');
  var item = skinsList[idx];
  fetch(API + '/api/admin/inventory/give', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({adminToken:adminToken, username:username, item:[item[0],'',item[1]]}) })
    .then(function(){ showInfo('Готово','Скин выдан игроку ' + username); });
}

async function adminManageInv(username){
  try{
    var r = await fetch(API + '/api/admin/inventory/list', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({adminToken:adminToken, username:username}) });
    var d = await r.json();
    if(!d.ok) return showInfo('Ошибка','Не удалось загрузить.');
    var inv = d.inventory || [];
    var html = '<div class="dialog-head"><h3>Инвентарь: ' + username + '</h3><button class="close" onclick="renderAdmin()">×</button></div>';
    if(!inv.length) html += '<div class="muted">Пусто.</div>';
    else html += inv.map(function(x, i){
      return '<div class="promo-row"><div><div style="font-weight:700;font-size:12px">' + x[0] + '</div><div class="promo-info">' + money(x[2]) + '</div></div>' +
        '<button class="promo-del" onclick="adminTakeSkin(\'' + username + '\',' + i + ')">Забрать</button></div>';
    }).join('');
    document.getElementById('adminDialog').innerHTML = html;
  }catch(e){}
}

async function adminTakeSkin(username, idx){
  if(!confirm('Точно забрать этот скин?')) return;
  try{
    await fetch(API + '/api/admin/inventory/take', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({adminToken:adminToken, username:username, index:idx}) });
    adminManageInv(username);
  }catch(e){}
}

async function renderAdminPromo(box){
  box.innerHTML = '<div class="admin-tabs"><button onclick="switchAdminTab(\'players\')">ИГРОКИ</button><button class="active" onclick="switchAdminTab(\'promo\')">ПРОМОКОДЫ</button></div>' +
    '<div style="background:#0e1116;border-radius:8px;padding:14px;margin-bottom:12px">' +
    '<h4 style="font-size:12px;color:#ff9a00;margin-bottom:8px">СОЗДАТЬ ПРОМОКОД</h4>' +
    '<input class="input" id="pCode" placeholder="Код (A-Z, 0-9), напр. STORM12">' +
    '<select class="input" id="pType"><option value="balance">Баланс (деньги)</option><option value="skin">Скин</option></select>' +
    '<input class="input" id="pAmount" type="number" placeholder="Сумма (для баланса)" value="500">' +
    '<input class="input" id="pSkin" placeholder="Название скина (если скин)">' +
    '<input class="input" id="pSkinPrice" type="number" placeholder="Цена скина (для инвентаря)">' +
    '<input class="input" id="pMaxUses" type="number" placeholder="Сколько активаций" value="1">' +
    '<input class="input" id="pExpires" type="date" placeholder="Действует до (необязательно)">' +
    '<button class="add-btn" style="width:100%" onclick="createPromo()">Создать</button>' +
    '</div><div id="promoList"><div class="muted">Загрузка...</div></div>';
  loadPromoList();
}

async function loadPromoList(){
  var box = document.getElementById('promoList');
  try{
    var r = await fetch(API + '/api/admin/promo/list', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({adminToken:adminToken}) });
    var d = await r.json();
    if(!d.ok){ box.innerHTML = '<div class="muted">Ошибка.</div>'; return; }
    if(!d.promos.length){ box.innerHTML = '<div class="muted">Промокодов нет.</div>'; return; }
    box.innerHTML = d.promos.map(function(p){
      var info = p.type === 'balance' ? ('+ ' + p.amount + ' ₽') : p.skinName;
      var used = p.usedCount + '/' + p.maxUses;
      var exp = p.expiresAt ? ' · до ' + new Date(p.expiresAt).toLocaleDateString('ru-RU') : '';
      return '<div class="promo-row"><div><div class="promo-code">' + p.code + '</div><div class="promo-info">' + info + ' · ' + used + exp + '</div></div>' +
        '<button class="promo-del" onclick="deletePromo(\'' + p.code + '\')">Удалить</button></div>';
    }).join('');
  }catch(e){ box.innerHTML = '<div class="muted">Ошибка.</div>'; }
}

async function createPromo(){
  var code = document.getElementById('pCode').value.trim().toUpperCase();
  var type = document.getElementById('pType').value;
  var amount = Number(document.getElementById('pAmount').value || 0);
  var skinName = document.getElementById('pSkin').value.trim();
  var skinPrice = Number(document.getElementById('pSkinPrice').value || 0);
  var maxUses = Number(document.getElementById('pMaxUses').value || 1);
  var expDate = document.getElementById('pExpires').value;
  if(!code) return showInfo('Ошибка','Введите код.');
  if(type === 'skin' && !skinName) return showInfo('Ошибка','Введите название скина.');
  var expiresAt = expDate ? new Date(expDate).getTime() : null;
  try{
    var r = await fetch(API + '/api/admin/promo/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
      adminToken: adminToken, code: code, type: type, amount: amount, skinName: skinName, skinPrice: skinPrice, maxUses: maxUses, expiresAt: expiresAt
    })});
    var d = await r.json();
    if(d.ok){ showInfo('Готово','Промокод ' + code + ' создан.'); renderAdminPromo(document.getElementById('adminDialog')); }
    else showInfo('Ошибка', d.error || 'Не удалось');
  }catch(e){ showInfo('Ошибка','Сервер недоступен'); }
}

async function deletePromo(code){
  if(!confirm('Удалить промокод ' + code + '?')) return;
  try{
    await fetch(API + '/api/admin/promo/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({adminToken:adminToken, code:code}) });
    loadPromoList();
  }catch(e){}
}

function showInfo(title, text){
  document.getElementById('genericDialog').innerHTML = '<div class="dialog-head"><h3>' + title + '</h3><button class="close" onclick="closeModal(\'genericModal\')">×</button></div>' +
    '<p class="muted">' + text + '</p><button class="add-btn" style="width:100%;margin-top:12px" onclick="closeModal(\'genericModal\')">Закрыть</button>';
  openModal('genericModal');
}

function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal').forEach(function(x){ x.addEventListener('click', function(e){ if(e.target === x) closeModal(x.id); }); });

loadMe();
go('cases');
</script>
</body>
</html>
