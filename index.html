<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Strike</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07101c;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

button{
  border:0;
  color:white;
  font-weight:bold;
  font-size:18px;
  touch-action:none;
  -webkit-user-select:none;
}

/* MENU */
#menu{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#123354,#050a12 70%);
}

.menuBox{
  width:min(90%,650px);
  padding:35px;
  text-align:center;
  border:2px solid #49739d;
  border-radius:30px;
  background:#091524;
  box-shadow:0 0 40px #00bfff22;
}

.logo{
  color:#58dcff;
  font-size:50px;
  font-weight:900;
  letter-spacing:5px;
  margin-bottom:10px;
}

.subtitle{
  color:#bbb;
  font-size:20px;
  margin-bottom:40px;
}

.teams{
  display:flex;
  gap:20px;
}

.team{
  flex:1;
  height:100px;
  border:2px solid #49739d;
  border-radius:25px;
  background:#172941;
  font-size:25px;
}

.team:active{
  transform:scale(.96);
  background:#285077;
}

/* HUD */
#game{
  display:none;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

#score{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 25px;
  background:#07101dcc;
  color:white;
  font-size:22px;
  border-radius:10px;
}

#money{
  position:absolute;
  left:15px;
  top:15px;
  color:#62ff8b;
  font-size:21px;
  font-weight:bold;
}

#ammo{
  position:absolute;
  right:20px;
  top:15px;
  font-size:28px;
  font-weight:bold;
}

#weapon{
  position:absolute;
  right:20px;
  top:52px;
  color:#aaa;
}

#hp{
  position:absolute;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  font-size:25px;
  font-weight:bold;
  color:#fff;
  background:#07101dcc;
  padding:8px 25px;
  border-radius:15px;
}

#cross{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#5cff65;
  font-size:25px;
}

/* JOYSTICK */
#joystick{
  position:fixed;
  left:25px;
  bottom:30px;
  width:150px;
  height:150px;
  border-radius:50%;
  background:#ffffff18;
  border:2px solid #ffffff30;
  z-index:20;
  touch-action:none;
}

#stick{
  position:absolute;
  width:65px;
  height:65px;
  left:42px;
  top:42px;
  border-radius:50%;
  background:#ffffff55;
  border:2px solid #ffffff66;
}

/* LOOK AREA */
#look{
  position:fixed;
  right:0;
  top:0;
  width:55%;
  height:70%;
  z-index:11;
  touch-action:none;
}

/* BUTTONS */
.controls{
  position:fixed;
  right:18px;
  bottom:20px;
  z-index:20;
  display:grid;
  grid-template-columns:75px 75px 75px;
  gap:10px;
  touch-action:none;
}

.ctrl{
  width:75px;
  height:65px;
  border-radius:18px;
  background:#17212dcc;
  border:2px solid #ffffff30;
  font-size:14px;
}

.ctrl:active,
.ctrl.active{
  background:#28a9e655;
  transform:scale(.94);
}

.fire{
  grid-column:2/4;
  width:160px;
  background:#b21f2d99;
  font-size:22px;
}

#shopBtn{
  position:fixed;
  left:185px;
  bottom:30px;
  z-index:21;
  width:100px;
  height:55px;
  border-radius:15px;
  background:#182b42dd;
}

/* SHOP */
#shop{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#080e16f5;
  overflow:auto;
  padding:20px;
}

.shopTitle{
  text-align:center;
  font-size:30px;
  margin:10px;
}

.close{
  position:absolute;
  right:20px;
  top:15px;
  font-size:35px;
  background:none;
}

.weapons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  max-width:800px;
  margin:40px auto;
}

.weaponCard{
  min-height:100px;
  background:#16263b;
  border:1px solid #42617e;
  border-radius:12px;
  padding:12px;
}

.weaponCard b{
  display:block;
  font-size:18px;
  margin-bottom:8px;
}

.weaponCard span{
  color:#ffe44f;
}

.buy{
  margin-top:10px;
  width:100%;
  height:35px;
  border-radius:8px;
  background:#24648b;
  font-size:14px;
}

/* PAUSE */
#message{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:#000b;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:20px;
}

#message h1{
  font-size:40px;
}

@media(max-width:700px){
  .logo{font-size:35px}
  .subtitle{font-size:16px}
  .menuBox{padding:25px}
  .teams{flex-direction:column}
  .team{height:75px}
  .weapons{grid-template-columns:repeat(2,1fr)}
}

@media(orientation:portrait){
  #game:after{
    content:"Поверни телефон горизонтально";
    position:fixed;
    inset:0;
    z-index:999;
    background:#07101c;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:22px;
    text-align:center;
  }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- МЕНЮ -->
<div id="menu">
  <div class="menuBox">
    <div class="logo">NEON STRIKE</div>
    <div class="subtitle">мобильный FPS • оригинальная карта</div>

    <div class="teams">
      <button class="team" id="blue">СИНЯЯ</button>
      <button class="team" id="orange">ОРАНЖЕВАЯ</button>
    </div>
  </div>
</div>

<!-- ИГРА -->
<div id="game">

  <div id="hud">
    <div id="score">0 : 0</div>
    <div id="money">$5500</div>
    <div id="ammo">30 / 90</div>
    <div id="weapon">RIFLE</div>
    <div id="cross">+</div>
    <div id="hp">❤ 100</div>
  </div>

  <div id="look"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="shopBtn" class="ctrl">SHOP</button>

  <div class="controls">
    <button id="reload" class="ctrl">RELOAD</button>
    <button id="jump" class="ctrl">JUMP</button>
    <button id="crouch" class="ctrl">CROUCH</button>

    <button id="run" class="ctrl">RUN</button>
    <button id="swap" class="ctrl">SWAP</button>
    <button id="pause" class="ctrl">II</button>

    <button id="fire" class="ctrl fire">🔥 FIRE</button>
  </div>
</div>

<!-- МАГАЗИН -->
<div id="shop">
  <button class="close" id="closeShop">×</button>
  <div class="shopTitle">МАГАЗИН</div>

  <div class="weapons">

    <div class="weaponCard">
      <b>PISTOL</b>
      <span>$200</span>
      <button class="buy" data-name="PISTOL" data-price="200">КУПИТЬ</button>
    </div>

    <div class="weaponCard">
      <b>SMG</b>
      <span>$1000</span>
      <button class="buy" data-name="SMG" data-price="1000">КУПИТЬ</button>
    </div>

    <div class="weaponCard">
      <b>RIFLE</b>
      <span>$1800</span>
      <button class="buy" data-name="RIFLE" data-price="1800">КУПИТЬ</button>
    </div>

    <div class="weaponCard">
      <b>SHOTGUN</b>
      <span>$2000</span>
      <button class="buy" data-name="SHOTGUN" data-price="2000">КУПИТЬ</button>
    </div>

    <div class="weaponCard">
      <b>SNIPER</b>
      <span>$4000</span>
      <button class="buy" data-name="SNIPER" data-price="4000">КУПИТЬ</button>
    </div>

    <div class="weaponCard">
      <b>ARMOR</b>
      <span>$600</span>
      <button class="buy" data-name="ARMOR" data-price="600">КУПИТЬ</button>
    </div>

  </div>
</div>

<div id="message">
  <h1 id="messageText">ПАУЗА</h1>
  <button class="team" id="resume">ПРОДОЛЖИТЬ</button>
</div>

<script>
"use strict";

/* =========================
   ОСНОВНЫЕ ПЕРЕМЕННЫЕ
========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W=0,H=0;

function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

const menu=document.getElementById("menu");
const game=document.getElementById("game");

let playing=false;
let paused=false;

let money=5500;
let hp=100;

let ammo=30;
let reserve=90;

let weapon="RIFLE";

let scoreBlue=0;
let scoreOrange=0;

let angle=0;

let player={
  x:3.5,
  y:3.5
};

/* =========================
   КАРТА
========================= */

const map=[
"111111111111",
"100000000001",
"100011100001",
"100010000001",
"100010111101",
"100000100001",
"101110100001",
"100000000001",
"100111011101",
"100000000001",
"100000000001",
"111111111111"
];

const TILE=1;

function wall(x,y){
  const xx=Math.floor(x);
  const yy=Math.floor(y);

  if(yy<0 || yy>=map.length || xx<0 || xx>=map[0].length)
    return true;

  return map[yy][xx]==="1";
}

/* =========================
   КОМАНДА
========================= */

function start(team){

  menu.style.display="none";
  game.style.display="block";

  playing=true;
  paused=false;

  player.x=team==="blue"?2.5:9.5;
  player.y=9.5;

  angle=team==="blue"?0:Math.PI;

  hp=100;
  ammo=30;
  reserve=90;
  money=5500;

  updateHUD();
}

document.getElementById("blue").addEventListener("pointerdown",e=>{
  e.preventDefault();
  start("blue");
});

document.getElementById("orange").addEventListener("pointerdown",e=>{
  e.preventDefault();
  start("orange");
});

/* =========================
   HUD
========================= */

function updateHUD(){

  document.getElementById("money").textContent="$"+money;

  document.getElementById("ammo").textContent=
    ammo+" / "+reserve;

  document.getElementById("weapon").textContent=weapon;

  document.getElementById("hp").textContent="❤ "+hp;

  document.getElementById("score").textContent=
    scoreBlue+" : "+scoreOrange;
}

/* =========================
   ДВИЖЕНИЕ
========================= */

let joyX=0;
let joyY=0;

function move(){

  if(!playing || paused)return;

  const speed=0.055;

  const forward=joyY*speed;
  const side=joyX*speed;

  let nx=
    player.x+
    Math.cos(angle)*forward+
    Math.cos(angle+Math.PI/2)*side;

  let ny=
    player.y+
    Math.sin(angle)*forward+
    Math.sin(angle+Math.PI/2)*side;

  if(!wall(nx,player.y))
    player.x=nx;

  if(!wall(player.x,ny))
    player.y=ny;
}

/* =========================
   ДЖОЙСТИК
========================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyPointer=null;

function joystickMove(e){

  const r=joystick.getBoundingClientRect();

  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);

  const max=42;
  const d=Math.hypot(x,y);

  if(d>max){
    x=x/d*max;
    y=y/d*max;
  }

  stick.style.transform=
    `translate(${x}px,${y}px)`;

  joyX=x/max;
  joyY=y/max;
}

joystick.addEventListener("pointerdown",e=>{
  e.preventDefault();
  joyPointer=e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  joystickMove(e);
});

joystick.addEventListener("pointermove",e=>{
  if(e.pointerId===joyPointer){
    e.preventDefault();
    joystickMove(e);
  }
});

function joyEnd(e){

  if(e.pointerId!==joyPointer)return;

  joyPointer=null;
  joyX=0;
  joyY=0;

  stick.style.transform="translate(0,0)";
}

joystick.addEventListener("pointerup",joyEnd);
joystick.addEventListener("pointercancel",joyEnd);

/* =========================
   ОБЗОР
========================= */

const look=document.getElementById("look");

let lookPointer=null;
let lastX=0;

look.addEventListener("pointerdown",e=>{
  e.preventDefault();

  lookPointer=e.pointerId;
  lastX=e.clientX;

  look.setPointerCapture(e.pointerId);
});

look.addEventListener("pointermove",e=>{

  if(e.pointerId!==lookPointer)return;

  e.preventDefault();

  const dx=e.clientX-lastX;

  angle+=dx*0.008;

  lastX=e.clientX;
});

function lookEnd(e){

  if(e.pointerId===lookPointer)
    lookPointer=null;
}

look.addEventListener("pointerup",lookEnd);
look.addEventListener("pointercancel",lookEnd);

/* =========================
   СТРЕЛЬБА
========================= */

let firing=false;
let lastShot=0;

function shoot(){

  if(!playing || paused)return;

  const now=performance.now();

  if(now-lastShot<120)return;

  lastShot=now;

  if(ammo<=0){
    reload();
    return;
  }

  ammo--;

  /* простая отдача */
  angle+=(Math.random()-.5)*0.025;

  updateHUD();
}

const fire=document.getElementById("fire");

fire.addEventListener("pointerdown",e=>{
  e.preventDefault();
  firing=true;
  fire.classList.add("active");
  shoot();
});

function stopFire(){
  firing=false;
  fire.classList.remove("active");
}

fire.addEventListener("pointerup",stopFire);
fire.addEventListener("pointercancel",stopFire);
fire.addEventListener("pointerleave",stopFire);

/* =========================
   RELOAD
========================= */

function reload(){

  if(ammo>=30 || reserve<=0)return;

  const need=30-ammo;
  const take=Math.min(need,reserve);

  ammo+=take;
  reserve-=take;

  updateHUD();
}

document.getElementById("reload").addEventListener("pointerdown",e=>{
  e.preventDefault();
  reload();
});

/* =========================
   JUMP
========================= */

let jumpTime=0;

document.getElementById("jump").addEventListener("pointerdown",e=>{
  e.preventDefault();

  if(!jumpTime)
    jumpTime=300;
});

/* =========================
   CROUCH
========================= */

let crouch=false;

document.getElementById("crouch").addEventListener("pointerdown",e=>{
  e.preventDefault();

  crouch=!crouch;

  e.currentTarget.classList.toggle("active",crouch);
});

/* =========================
   RUN
========================= */

let running=false;

document.getElementById("run").addEventListener("pointerdown",e=>{
  e.preventDefault();

  running=!running;

  e.currentTarget.classList.toggle("active",running);
});

/* =========================
   СМЕНА ОРУЖИЯ
========================= */

const weapons=[
  "PISTOL",
  "SMG",
  "RIFLE",
  "SHOTGUN",
  "SNIPER"
];

let weaponIndex=2;

document.getElementById("swap").addEventListener("pointerdown",e=>{
  e.preventDefault();

  weaponIndex++;

  if(weaponIndex>=weapons.length)
    weaponIndex=0;

  weapon=weapons[weaponIndex];

  ammo=30;

  updateHUD();
});

/* =========================
   МАГАЗИН
========================= */

const shop=document.getElementById("shop");

document.getElementById("shopBtn").addEventListener("pointerdown",e=>{
  e.preventDefault();
  shop.style.display="block";
});

document.getElementById("closeShop").addEventListener("pointerdown",e=>{
  e.preventDefault();
  shop.style.display="none";
});

document.querySelectorAll(".buy").forEach(btn=>{

  btn.addEventListener("pointerdown",e=>{

    e.preventDefault();

    const price=Number(btn.dataset.price);
    const name=btn.dataset.name;

    if(money<price){
      alert("Недостаточно денег");
      return;
    }

    money-=price;

    if(name==="ARMOR"){
      hp=Math.min(150,hp+50);
    }else{
      weapon=name;
      ammo=30;
      weaponIndex=weapons.indexOf(name);
      if(weaponIndex<0)weaponIndex=2;
    }

    updateHUD();

    shop.style.display="none";
  });

});

/* =========================
   PAUSE
========================= */

document.getElementById("pause").addEventListener("pointerdown",e=>{
  e.preventDefault();

  paused=true;
  document.getElementById("message").style.display="flex";
});

document.getElementById("resume").addEventListener("pointerdown",e=>{
  e.preventDefault();

  paused=false;
  document.getElementById("message").style.display="none";
});

/* =========================
   РЕНДЕР
========================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  /* небо */
  const sky=ctx.createLinearGradient(0,0,0,H/2);
  sky.addColorStop(0,"#55bce8");
  sky.addColorStop(1,"#b8e8ff");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H/2);

  /* земля */
  ctx.fillStyle="#777";
  ctx.fillRect(0,H/2,W,H/2);

  /* лучи */
  const rays=Math.min(180,Math.floor(W/5));
  const fov=Math.PI/3;

  for(let i=0;i<rays;i++){

    const ra=
      angle-fov/2+
      (i/rays)*fov;

    let dist=0;

    while(dist<15){

      dist+=0.03;

      const rx=player.x+Math.cos(ra)*dist;
      const ry=player.y+Math.sin(ra)*dist;

      if(wall(rx,ry))break;
    }

    const corrected=
      dist*Math.cos(ra-angle);

    const height=
      Math.min(H, H/(corrected+0.01));

    const shade=
      Math.max(30,180-corrected*10);

    ctx.fillStyle=
      `rgb(${shade},${shade+15},${shade+25})`;

    const x=i*(W/rays);

    ctx.fillRect(
      x,
      H/2-height/2,
      W/rays+1,
      height
    );
  }

  /* оружие */
  ctx.fillStyle="#151a20";

  ctx.fillRect(
    W*.62,
    H*.67,
    W*.28,
    H*.22
  );

  ctx.fillStyle="#333";

  ctx.fillRect(
    W*.54,
    H*.73,
    W*.18,
    H*.08
  );

  /* прицел */
  ctx.fillStyle="#63ff65";

  ctx.fillRect(W/2-2,H/2-2,4,4);
}

/* =========================
   ИГРОВОЙ ЦИКЛ
========================= */

function loop(){

  if(playing){

    move();

    if(firing)
      shoot();

    if(jumpTime>0)
      jumpTime-=16;
  }

  draw();

  requestAnimationFrame(loop);
}

loop();

/* =========================
   ЗАПРЕТ СИСТЕМНЫХ ЖЕСТОВ
========================= */

document.addEventListener("touchmove",e=>{
  e.preventDefault();
},{passive:false});

document.addEventListener("gesturestart",e=>{
  e.preventDefault();
});

document.addEventListener("contextmenu",e=>{
  e.preventDefault();
});
</script>

</body>
</html>
