function calcUpgradeChance(fromValue,targetValue){
  if(!fromValue||!targetValue||targetValue<=fromValue)return targetValue>0?80:0;
  // Модель с известным процентом: 80% отдачи, как у опубликованного симулятора Case-Battle.
  // Чем выше множитель цели, тем ниже шанс.
  let chance=(fromValue/targetValue)*80;
  return Math.max(1,Math.min(80,chance));
}
function updateUpgradeChance(){
  const a=document.getElementById('upFrom'),b=document.getElementById('upTo');
  if(!a||!b)return;
  const chanceEl=document.getElementById('upChance'),info=document.getElementById('upInfo');
  if(a.value===''||b.value===''){chanceEl.textContent='0%';info.textContent='';return}
  const from=s.inventory[Number(a.value)],to=skins[Number(b.value)];
  const chance=calcUpgradeChance(from[2],to[2]);
  chanceEl.textContent=chance.toFixed(2)+'%';
  info.textContent='  Множитель: x'+(to[2]/from[2]).toFixed(2);
}
function doUpgrade(){
  const a=document.getElementById('upFrom'),b=document.getElementById('upTo');
  if(!a||!b||a.value===''||b.value==='')return alert('Выбери предмет и цель');
  const i=Number(a.value), target=skins[Number(b.value)], from=s.inventory[i];
  const chance=calcUpgradeChance(from[2],target[2]);
