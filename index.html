    <div style="color:#aaaed0;font-size:13px">ТВОЙ ПРЕДМЕТ</div>
    <div style="font-size:48px;margin:8px">${from[1]}</div><b>${from[0]}</b><div class="price">${F(from[2])}</div>
    <div class="upgrade-orb spinning" id="upgradeOrb">⚡</div>
    <div class="meter"><span id="upgradeMeter"></span></div>
    <div style="color:#aaaed0;font-size:13px">ЦЕЛЬ</div><div style="font-size:42px;margin:8px">${target[1]}</div><b>${target[0]}</b><div class="price">${F(target[2])}</div>
    <p id="upgradeStatus">Шанс успеха: ${chance.toFixed(2)}% · Проверяем апгрейд…</p>
  </div><button id="upgradeClose" disabled style="width:100%;opacity:.45">Идёт апгрейд…</button>`;
  modal.classList.add('show');
  requestAnimationFrame(()=>{const m=document.getElementById('upgradeMeter');if(m)m.style.width='100%'});
  setTimeout(()=>{
    const orb=document.getElementById('upgradeOrb'),status=document.getElementById('upgradeStatus'),btn=document.getElementById('upgradeClose');
    if(success){
      s.inventory[i]=[...target];s.max=Math.max(s.max,target[2]);
      orb.className='upgrade-orb win';orb.textContent='✓';
      status.innerHTML=`<b style="color:#ffd25c">УСПЕХ! Получен ${target[0]} — ${F(target[2])}</b>`;
    }else{
      s.inventory.splice(i,1);
      orb.className='upgrade-orb fail';orb.textContent='×';
      status.innerHTML='<b style="color:#ff7373">НЕУДАЧА — предмет потерян</b>';
    }
    s.upgrades++;save();
    btn.disabled=false;btn.style.opacity='1';btn.textContent='Продолжить';
    btn.onclick=()=>{modal.classList.remove('show');page('upgrade')};
  },2200);
}
function topup(){document.getElementById('box').innerHTML=`<h2>Пополнение виртуального баланса</h2><input id="code" placeholder="Секретный код"><button onclick="unlock()">Проверить</button>`;document.getElementById('modal').classList.add('show')}
function unlock(){if(document.getElementById('code').value!==CODE)return alert('Неверный код');document.getElementById('box').innerHTML='<h2>Добавить виртуальные ₽</h2>'+[1000,5000,10000,50000,100000].map(v=>`<button style="display:block;margin:8px 0;width:100%" onclick="add(${v})">+ ${F(v)}</button>`).join('')}
function add(v){s.balance+=v;save();document.getElementById('modal').classList.remove('show')}
function setAuthMode(m){authMode=m;let r=m==='register';document.getElementById('authTitle').textContent=r?'📝 Регистрация':'🔐 Вход';document.getElementById('authBtn').textContent=r?'Зарегистрироваться':'Войти';document.getElementById('authPassword2').style.display=r?'block':'none';document.getElementById('loginTab').className=r?'dark':'active';document.getElementById('registerTab').className=r?'active':'dark';document.getElementById('authMsg').textContent=''}
function authSubmit(){let l=document.getElementById('authLogin').value.trim(),p=document.getElementById('authPassword').value,p2=document.getElementById('authPassword2').value,msg=document.getElementById('authMsg');if(!/^[A-Za-z0-9_]{3,20}$/.test(l)){msg.textContent='Логин: 3–20 символов, латиница, цифры и _.';return}if(p.length<6){msg.textContent='Пароль минимум 6 символов.';return}if(authMode==='register'){if(p!==p2){msg.textContent='Пароли не совпадают.';return}if(users[l]){msg.textContent='Такой логин уже существует.';return}users[l]={password:p,data:{balance:5000,inventory:[],cases:0,upgrades:0,max:0}};localStorage.setItem(USERS,JSON.stringify(users))}else if(!users[l]||users[l].password!==p){msg.textContent='Неверный логин или пароль.';return}currentUser=l;s=users[l].data;localStorage.setItem(SESSION,l);save();document.getElementById('authModal').classList.remove('show');page('cases')}
function logout(){localStorage.removeItem(SESSION);location.reload()}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};if(currentUser){document.getElementById('authModal').classList.remove('show');save();page('cases')}else document.getElementById('bal').textContent=F(s.balance);
</script></body></html>
