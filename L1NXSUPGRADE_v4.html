<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L1NXSUPGRADE v4.0</title><style>body{margin:0;background:#070812;color:#fff;font-family:Arial,sans-serif}header{padding:16px;background:#0d1020;display:flex;justify-content:space-between;position:sticky;top:0}.logo{font-size:22px;font-weight:900}.logo span{color:#a83cff}.wrap{max-width:1200px;margin:auto;padding:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{border:0;border-radius:9px;padding:11px 15px;background:#7728e8;color:white;font-weight:700}button.dark{background:#171b30}.hero,.panel,.card{background:#0e1222;border:1px solid #292e4d;border-radius:15px;padding:16px;margin-bottom:16px}.hero{background:linear-gradient(110deg,#27104e,#10162d)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.skin{height:115px;background:radial-gradient(circle,#4b237d,#111326);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:62px}.name{font-weight:800;margin-top:9px}.price{color:#ffd25c;font-weight:900;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#11152a;padding:16px;border-radius:12px}.stat b{display:block;font-size:25px;margin-top:6px}.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{background:#0d1122;border:1px solid #6431a0;border-radius:16px;padding:20px;width:min(600px,100%)}input,select{background:#090c18;color:#fff;border:1px solid #343b60;border-radius:9px;padding:11px;width:100%;box-sizing:border-box;margin:6px 0}.reel{display:flex;gap:8px;overflow:hidden;padding:12px;background:#070914;border-radius:12px}.item{min-width:110px;background:#151a2e;border-radius:9px;padding:8px;text-align:center}.mobile{display:none}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header .nav{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#080a15;padding:8px;justify-content:space-around;z-index:20}.wrap{padding-bottom:75px}}</style></head><body><header><div class="logo">L1NXS<span>UPGRADE</span> <small>v4.0</small></div><div>Баланс: <b id="bal">5000 ₽</b> <button onclick="topup()">Пополнить</button></div></header><div class="wrap"><div class="nav"><button onclick="page('cases')">🎁 Кейсы</button><button onclick="page('shop')">🛒 Магазин</button><button onclick="page('upgrade')">⚡ Upgrade</button><button onclick="page('inv')">🎒 Инвентарь</button><button onclick="page('account')">👤 Аккаунт</button></div><main id="main"></main></div><div class="mobile"><button onclick="page('cases')">🎁</button><button onclick="page('shop')">🛒</button><button onclick="page('upgrade')">⚡</button><button onclick="page('inv')">🎒</button><button onclick="page('account')">👤</button></div><div class="modal" id="modal"><div class="box" id="box"></div></div><script>
const KEY='L1NXSUPGRADE_V4',CODE='L1nxsBog';let s=JSON.parse(localStorage.getItem(KEY)||'null')||{balance:5000,inventory:[],cases:0,upgrades:0,max:0};const F=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const skins=[['Karambit | Doppler','🔪',78450],['Butterfly Knife | Fade','🔪',62300],['M9 Bayonet | Crimson Web','🔪',48200],['Bayonet | Marble Fade','🔪',55700],['Flip Knife | Lore','🔪',42800],['AWP | Dragon Lore','🎯',1250000],['AK-47 | Fire Serpent','🔫',36000],['M4A4 | Howl','🔫',480000],['AK-47 | Redline','🔫',2850],['AK-47 | Vulcan','🔫',3250],['AWP | Asiimov','🎯',4750],['M4A1-S | Hyper Beast','🔫',2980],['Glock-18 | Fade','🔫',12300],['USP-S | Kill Confirmed','🔫',2450],['Desert Eagle | Printstream','🔫',3990],['P250 | See Ya Later','🔫',1120],['FAMAS | Commemoration','🔫',1890],['MP9 | Starlight Protector','🔫',980],['MAC-10 | Neon Rider','🔫',2650],['P90 | Asiimov','🔫',1750],['SSG 08 | Dragonfire','🎯',1980],['Gloves | Pandora’s Box','🧤',420000],['Gloves | Vice','🧤',215000]];
const cases=[['Starter Case',29,'🎁'],['Daily Case',49,'📦'],['Neon Case',79,'🟣'],['Cyber Case',159,'🤖'],['Inferno Case',249,'🔥'],['Knife Rush',449,'🔪'],['Gold Case',599,'👑'],['Royal Case',799,'💎'],['Dragon Case',899,'🐉'],['Galaxy Case',1199,'🌌'],['Quantum Case',1499,'🌀'],['Omega Case',1799,'Ω'],['Eclipse Case',2199,'🌘'],['Titan Case',2499,'🗿'],['Blackout Case',2999,'⬛'],['Diamond Case',3499,'💠'],['Imperial Case',3999,'🏰'],['Crown Case',4999,'👑'],['Ultra Case',5999,'🚀'],['Mythic Case',7499,'✨'],['Legend Case',9999,'🔥'],['Infinity Case',14999,'♾️'],['Founder Case',19999,'⭐']];
function save(){localStorage.setItem(KEY,JSON.stringify(s));document.getElementById('bal').textContent=F(s.balance)}
function card(x,buy=true){return `<div class="card"><div class="skin">${x[1]}</div><div class="name">${x[0]}</div><div class="price">${F(x[2])}</div>${buy?`<button onclick="buy('${encodeURIComponent(x[0])}')">Купить</button>`:''}</div>`}
function page(x){let m=document.getElementById('main');if(x==='shop')m.innerHTML=`<div class="panel"><h2>🛒 Магазин</h2><input id="q" placeholder="Поиск скина"><div class="grid" id="g">${skins.map(card).join('')}</div></div>`;else if(x==='inv')m.innerHTML=`<div class="panel"><h2>🎒 Инвентарь</h2>${s.inventory.length?'<div class="grid">'+s.inventory.map((x,i)=>card(x,false)+`<button onclick="upgrade(${i})">В Upgrade</button>`).join('')+'</div>':'<p>Инвентарь пуст.</p>'}`;else if(x==='upgrade')m.innerHTML=`<div class="panel"><h2>⚡ Upgrade</h2><p>Выбери предмет в инвентаре и нажми Upgrade.</p><button onclick="page('inv')">Открыть инвентарь</button></div>`;else if(x==='account')m.innerHTML=`<div class="panel"><h2>👤 Аккаунт</h2><div class="stats"><div class="stat">Баланс<b>${F(s.balance)}</b></div><div class="stat">Кейсов открыто<b>${s.cases}</b></div><div class="stat">Апгрейдов<b>${s.upgrades}</b></div><div class="stat">Максимальный выигрыш<b>${F(s.max)}</b></div></div></div>`;else m.innerHTML=`<div class="hero"><h1>🎁 L1NXSUPGRADE</h1><p>Кейсы, магазин скинов, Upgrade и инвентарь.</p></div><div class="grid">${cases.map((c,i)=>`<div class="card"><div class="skin">${c[2]}</div><div class="name">${c[0]}</div><div class="price">${F(c[1])}</div><button onclick="openCase(${i})">Открыть</button></div>`).join('')}</div>`;save()}
function buy(n){let x=skins.find(a=>a[0]===decodeURIComponent(n));if(!x)return;if(s.balance<x[2])return alert('Недостаточно виртуальных ₽');s.balance-=x[2];s.inventory.push([...x]);save();page('inv')}
function openCase(i){let c=cases[i];if(s.balance<c[1])return alert('Недостаточно виртуальных ₽');s.balance-=c[1];s.cases++;let win=skins[Math.floor(Math.random()*skins.length)];s.max=Math.max(s.max,win[2]);save();document.getElementById('box').innerHTML=`<h2>${c[2]} ${c[0]}</h2><div class="reel" id="reel">${Array.from({length:18},(_,j)=>`<div class="item">${j===15?win[1]:'🔫'}<br>${j===15?win[0]:'Скин'}</div>`).join('')}</div><br><button onclick="finishCase(${JSON.stringify(win).replace(/</g,'&lt;')})">Забрать выигрыш</button>`;document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('reel').scrollTo({left:110*15,behavior:'smooth'}),100)}
function finishCase(x){s.inventory.push(x);save();document.getElementById('modal').classList.remove('show');page('inv')}
function upgrade(i){let x=s.inventory[i],chance=45;if(Math.random()*100<chance){let y=[...x];y[2]=Math.round(y[2]*2);y[0]=y[0]+' ★ Upgrade';s.inventory[i]=y;s.max=Math.max(s.max,y[2]);alert('Upgrade успешно: '+F(y[2]))}else{s.inventory.splice(i,1);alert('Upgrade не удался — предмет потерян')}s.upgrades++;save();page('inv')}
function topup(){document.getElementById('box').innerHTML=`<h2>Пополнение виртуального баланса</h2><input id="code" placeholder="Секретный код"><button onclick="unlock()">Проверить</button>`;document.getElementById('modal').classList.add('show')}
function unlock(){if(document.getElementById('code').value!==CODE)return alert('Неверный код');document.getElementById('box').innerHTML='<h2>Добавить виртуальные ₽</h2>'+[1000,5000,10000,50000,100000].map(v=>`<button style="display:block;margin:8px 0;width:100%" onclick="add(${v})">+ ${F(v)}</button>`).join('')}
function add(v){s.balance+=v;save();document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};save();page('cases');
</script></body></html>
